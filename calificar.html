<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calificar Actividades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f4f8fb; font-family: "Segoe UI", Arial, sans-serif; padding: 20px; }
    h1, h2 { text-align: center; }
    .card-materia { margin-top: 20px; }
    .card-actividad { cursor: pointer; transition: .2s; }
    .card-actividad:hover { transform: scale(1.01); }
    .table td, .table th { vertical-align: middle; }
    .nota-btn { width: 38px; height: 38px; margin: 2px; border: 0; border-radius: 5px; background: #ececec; }
    .nota-btn:hover { background: #0d6efd; color: #fff; }
    .nota-btn.sel { background: #198754; color: #fff; }
    .fila-seleccionada td { background: #e7f1ff !important; }
    .ausentes-toggle { cursor: pointer; }
    .nota-baja { background: #f8d7da !important; color: #842029; font-weight: 700; }
    .nota-alta { background: #d1e7dd !important; color: #0f5132; font-weight: 700; }
    .actividad-meta { font-size: 13px; color: #6c757d; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="sincronizacion/firebase/firebase-core.js?v=v2.25"></script>
  <script src="sincronizacion/firebase/firebase-roles.js?v=v2.25"></script>
  <script src="sincronizacion/firebase/firebase-storage.js?v=v2.25"></script>
  <script src="sincronizacion/firebase/firebase-attendance.js?v=v2.25"></script>
  <script src="sincronizacion/firebase/firebase-notes.js?v=v2.25"></script>
  <script src="sincronizacion/firebase/firebase-stats.js?v=v2.25"></script>
  <script src="sincronizacion/firebase/firebase-sync.js?v=v2.25"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12355b">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <script defer src="pwa.js?v=v2.25"></script>
</head>
<body>
  <script>
    if (sessionStorage.getItem("sesionDocente") !== "activa") {
      window.location.href = "index.html";
    }
  </script>
  <div class="container">
    <h1>Calificar Actividades</h1>
    <h2 id="curso"></h2>
    <p class="text-center fw-bold mb-1" id="fecha"></p>
    <p class="text-center text-muted" id="trimestreTexto"></p>
    <div id="contenedorMaterias"></div>
    <div class="text-center mt-4">
      <button class="btn btn-secondary" onclick="volver()">Volver</button>
    </div>
  </div>

  <div class="modal fade" id="modalCalificar" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloActividad"></h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="avisoAusentes" class="alert alert-warning py-2 d-none"></div>
          <div class="actividad-meta mb-3" id="detalleActividad"></div>
          <div class="table-responsive">
            <table class="table table-bordered align-middle">
              <thead class="table-primary">
                <tr>
                  <th>Alumno</th>
                  <th width="180" class="text-center">Calificar</th>
                </tr>
              </thead>
              <tbody id="tablaAlumnos"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-danger" onclick="eliminarActividadActual()">
            <i class="bi bi-trash3-fill"></i> Eliminar actividad
          </button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalNotas" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloAlumno"></h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <div id="cuadrosNotas"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let curso = "";
    let fecha = "";
    let trimestre = "";
    let actividades = [];
    let actividad = null;
    let alumno = "";
    let nota = null;
    let alumnosPresentes = [];
    let alumnosAusentes = [];

    const mCalificar = new bootstrap.Modal(document.getElementById("modalCalificar"));
    const mNotas = new bootstrap.Modal(document.getElementById("modalNotas"));

    function leerJSON(clave, inicial = {}) {
      try {
        return JSON.parse(localStorage.getItem(clave) || JSON.stringify(inicial));
      } catch (error) {
        return inicial;
      }
    }


    function nombreAlumno(item) {
      return typeof item === "string" ? item : String(item?.nombre || "").trim();
    }

    function alumnoActivo(item) {
      return typeof item === "string" ? true : item?.activo !== false;
    }

    function nombresAlumnosCurso(curso, soloActivos = true) {
      const lista = leerJSON("alumnos", {})[curso] || [];
      return lista
        .filter(item => !soloActivos || alumnoActivo(item))
        .map(nombreAlumno)
        .filter(Boolean);
    }

    function guardarJSON(clave, valor, sincronizar = true) {
      localStorage.setItem(clave, JSON.stringify(valor));
      if (sincronizar && window.firebaseMarkPackage) window.firebaseMarkPackage(clave);
      if (sincronizar && window.firebaseSyncNow) window.firebaseSyncNow();
    }

    function escapar(valor) {
      return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escaparAtributo(valor) {
      return String(valor).replaceAll("\\", "\\\\").replaceAll("'", "\\'");
    }

    function trimestreActual() {
      return localStorage.getItem("trimestreActual") || "1er Trimestre";
    }

    function iniciar() {
      const d = leerJSON("actividadesDiaSeleccionado", {});

      if (!d.curso) {
        alert("No existen datos.");
        volver();
        return;
      }

      curso = d.curso;
      fecha = d.fecha;
      trimestre = d.trimestre || trimestreActual();
      actividades = d.actividades || [];
      localStorage.setItem("trimestreActual", trimestre);
      document.getElementById("curso").textContent = curso;
      document.getElementById("fecha").textContent = fecha;
      document.getElementById("trimestreTexto").textContent = trimestre;
      dibujarMaterias();
    }

    function dibujarMaterias() {
      const c = document.getElementById("contenedorMaterias");
      c.innerHTML = "";

      if (!actividades.length) {
        c.innerHTML = '<div class="alert alert-warning text-center">No existen actividades para este trimestre.</div>';
        return;
      }

      const materias = {};
      actividades.forEach(a => {
        if (!materias[a.materia]) materias[a.materia] = [];
        materias[a.materia].push(a);
      });

      Object.keys(materias).forEach(materia => {
        const card = document.createElement("div");
        card.className = "card card-materia shadow";
        card.innerHTML = `<div class="card-header bg-primary text-white fw-bold">${escapar(materia)}</div>`;
        const lista = document.createElement("div");
        lista.className = "list-group list-group-flush";

        materias[materia].forEach(a => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "list-group-item list-group-item-action card-actividad";
          item.innerHTML = `
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <b>${escapar(a.titulo)}</b><br>
                <small class="text-muted">${escapar(a.tipo)}</small>
              </div>
              <span class="badge bg-${a.tipo === "Examen" ? "danger" : "success"}">${escapar(a.notaMaxima)} pts</span>
            </div>
          `;
          item.addEventListener("click", () => abrirActividad(a));
          lista.appendChild(item);
        });

        card.appendChild(lista);
        c.appendChild(card);
      });
    }

    function estadoAsistencia(nombre) {
      const asistencias = leerJSON("asistencias");
      return asistencias[`${fecha}|${curso}|${nombre}`] || "";
    }

    function estaHabilitadoParaCalificar(nombre) {
      return ["verde", "amarillo"].includes(estadoAsistencia(nombre));
    }

    function detalleNoCalificable(nombre) {
      const estado = estadoAsistencia(nombre);
      if (estado === "morado") return `${escapar(nombre)} <span class="badge text-bg-secondary">Permiso</span>`;
      return `${escapar(nombre)} <span class="badge text-bg-danger">Falta</span>`;
    }

    async function cargarAsistenciaParaCalificar() {
      if (!window.firebaseLoadAttendanceDay) return;
      try {
        await window.firebaseLoadAttendanceDay({ fecha, curso });
      } catch (error) {
        console.info("No se pudo cargar la asistencia del dia:", error.message);
      }
    }

    async function abrirActividad(actividadElegida) {
      if (sessionStorage.getItem("sesionRol") === "docente" && !window.requireInternetForFirebase("Conecte a internet para calificar actividades.")) return;
      actividad = actividadElegida;
      alumno = "";
      nota = null;
      document.getElementById("tituloActividad").textContent = actividad.titulo;
      document.getElementById("detalleActividad").textContent =
        `${actividad.materia || "-"} | ${actividad.tipo || "Actividad"} | ${actividad.notaMaxima || "-"} pts`;
      await cargarAsistenciaParaCalificar();
      prepararAlumnos();
      if (alumnosPresentes.length) alumno = alumnosPresentes[0];
      dibujarAlumnos();
      mCalificar.show();
    }

    function mismaActividad(a, b) {
      return a &&
        b &&
        a.curso === curso &&
        a.fecha === fecha &&
        (a.trimestre || trimestre) === trimestre &&
        a.materia === b.materia &&
        a.titulo === b.titulo &&
        a.tipo === b.tipo &&
        String(a.notaMaxima) === String(b.notaMaxima);
    }

    function limpiarNotasVacias(notas) {
      const materiaNotas = notas?.[curso]?.[trimestre]?.[actividad.materia];
      if (materiaNotas && !Object.keys(materiaNotas).length) delete notas[curso][trimestre][actividad.materia];
      if (notas?.[curso]?.[trimestre] && !Object.keys(notas[curso][trimestre]).length) delete notas[curso][trimestre];
      if (notas?.[curso] && !Object.keys(notas[curso]).length) delete notas[curso];
    }

    function eliminarActividadActual() {
      if (sessionStorage.getItem("sesionRol") === "docente" && !window.requireInternetForFirebase("Conecte a internet para eliminar actividades.")) return;
      if (!actividad) return;
      const detalle = `${actividad.tipo || "Actividad"}: ${actividad.titulo || "Sin titulo"}\nMateria: ${actividad.materia || "-"}\nFecha: ${fecha}\nTrimestre: ${trimestre}`;
      if (!confirm(`Esta seguro que desea eliminar esta actividad?\n\n${detalle}`)) return;

      const todas = leerJSON("actividades", []);
      const restantes = todas.filter(item => !mismaActividad(item, actividad));
      guardarJSON("actividades", restantes);
      if (window.firebaseForgetActivity) window.firebaseForgetActivity(actividad).catch(error => console.info("No se pudo eliminar actividad en Firebase:", error.message));

      const notas = leerJSON("notas");
      const registroNota = notas?.[curso]?.[trimestre]?.[actividad.materia]?.[actividad.titulo];
      if (registroNota && (!registroNota.fecha || registroNota.fecha === fecha)) {
        delete notas[curso][trimestre][actividad.materia][actividad.titulo];
        limpiarNotasVacias(notas);
        guardarJSON("notas", notas);
        if (window.firebaseForgetNote) window.firebaseForgetNote(curso, trimestre, actividad.materia, actividad.titulo).catch(error => console.info("No se pudo eliminar nota en Firebase:", error.message));
      }

      actividades = actividades.filter(item => !mismaActividad(item, actividad));
      guardarJSON("actividadesDiaSeleccionado", { curso, fecha, trimestre, actividades }, false);
      actividad = null;
      mNotas.hide();
      mCalificar.hide();
      dibujarMaterias();
    }

    function prepararAlumnos() {
      const alumnos = nombresAlumnosCurso(curso);
      alumnosPresentes = alumnos.filter(estaHabilitadoParaCalificar);
      alumnosAusentes = alumnos.filter(nombre => !estaHabilitadoParaCalificar(nombre));
    }

    function dibujarAusentes() {
      const aviso = document.getElementById("avisoAusentes");

      if (!alumnosAusentes.length) {
        aviso.classList.add("d-none");
        aviso.innerHTML = "";
        return;
      }

      aviso.classList.remove("d-none");
      aviso.innerHTML = `
        <div class="ausentes-toggle fw-bold" data-bs-toggle="collapse" data-bs-target="#listaAusentes">
          ${alumnosAusentes.length} alumno(s) sin calificacion del dia. Clic para ver.
        </div>
        <div class="collapse mt-2" id="listaAusentes">
          <ul class="mb-0">
            ${alumnosAusentes.map(nombre => `<li>${detalleNoCalificable(nombre)}</li>`).join("")}
          </ul>
        </div>
      `;
    }

    function dibujarAlumnos() {
      const tbody = document.getElementById("tablaAlumnos");
      const notas = leerJSON("notas");
      tbody.innerHTML = "";
      dibujarAusentes();

      if (!alumnosPresentes.length) {
        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">No hay alumnos presentes o con atraso para calificar.</td></tr>';
        return;
      }

      if (!alumno || !alumnosPresentes.includes(alumno)) alumno = alumnosPresentes[0];

      alumnosPresentes.forEach(nombre => {
        const registro = notas?.[curso]?.[trimestre]?.[actividad.materia]?.[actividad.titulo]?.alumnos?.[nombre];
        const nota100 = registro ? Number(registro.nota100 || 35) : null;
        const textoBoton = registro ? `Nota ${nota100}` : "Calificar";
        const claseBoton = registro ? (nota100 > 50 ? "btn-success" : "btn-danger") : "btn-primary";

        tbody.innerHTML += `
          <tr class="${nombre === alumno ? "fila-seleccionada" : ""}">
            <td role="button" onclick="seleccionarAlumno('${escaparAtributo(nombre)}')">${escapar(nombre)}</td>
            <td class="text-center">
              <button class="btn btn-sm ${claseBoton}" onclick="seleccionarAlumno('${escaparAtributo(nombre)}')">${textoBoton}</button>
            </td>
          </tr>
        `;
      });
    }

    function seleccionarAlumno(nombreAlumno) {
      alumno = nombreAlumno;
      const notas = leerJSON("notas");
      const registro = notas?.[curso]?.[trimestre]?.[actividad.materia]?.[actividad.titulo]?.alumnos?.[alumno];
      nota = registro ? Number(registro.notaOriginal) : null;
      document.getElementById("tituloAlumno").textContent = alumno;
      dibujarAlumnos();
      dibujarCuadros();
      mNotas.show();
    }

    function dibujarCuadros() {
      const c = document.getElementById("cuadrosNotas");
      const max = Number(actividad.notaMaxima);
      c.innerHTML = "";

      for (let i = 0; i <= max; i++) {
        const clase = nota === i ? "sel" : "";
        c.innerHTML += `<button class="nota-btn ${clase}" onclick="guardarNota(${i})">${i}</button>`;
      }
    }

    function convertirNota(valor, maxima) {
      if (valor === null || valor === "") return 35;
      const porcentaje = Math.round((Number(valor) * 100) / Number(maxima));
      return Math.max(35, Math.min(100, porcentaje));
    }

    function guardarNota(valor) {
      if (sessionStorage.getItem("sesionRol") === "docente" && !window.requireInternetForFirebase("Conecte a internet para guardar calificaciones.")) return;
      const notas = leerJSON("notas");

      if (!notas[curso]) notas[curso] = {};
      if (!notas[curso][trimestre]) notas[curso][trimestre] = {};
      if (!notas[curso][trimestre][actividad.materia]) notas[curso][trimestre][actividad.materia] = {};

      if (!notas[curso][trimestre][actividad.materia][actividad.titulo]) {
        notas[curso][trimestre][actividad.materia][actividad.titulo] = {
          tipo: actividad.tipo,
          notaMaxima: actividad.notaMaxima,
          fecha: fecha,
          alumnos: {}
        };
      }

      notas[curso][trimestre][actividad.materia][actividad.titulo].alumnos[alumno] = {
        notaOriginal: Number(valor),
        nota100: convertirNota(valor, actividad.notaMaxima),
        notaMaxima: actividad.notaMaxima,
        fechaCalificacion: new Date().toISOString()
      };

      guardarJSON("notas", notas);
      const actual = alumnosPresentes.indexOf(alumno);
      const siguiente = alumnosPresentes[actual + 1];
      dibujarAlumnos();

      if (siguiente) {
        seleccionarAlumno(siguiente);
      } else {
        mNotas.hide();
      }
    }

    function volver() {
      location.href = "mes.html";
    }

    window.firebaseAfterDataUpdated = function () {
      if (actividad) {
        prepararAlumnos();
        dibujarAlumnos();
      }
      dibujarMaterias();
    };

    iniciar();
  </script>
</body>
</html>
