<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  let anio = parseInt(params.get("anio"));
  let mes = parseInt(params.get("mes"));
  let dia = parseInt(params.get("dia"));

  const nombreMeses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
                       "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const diasSemana = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

  const hoy = new Date();
  if (!anio) anio = hoy.getFullYear();
  if (!mes) mes = hoy.getMonth() + 1;
  if (!dia) dia = hoy.getDate();
  const esHoy = hoy.getFullYear() === anio &&
                hoy.getMonth() + 1 === mes &&
                hoy.getDate() === dia;
  const CURSOS_DEFAULT = [
    "Pre Inicial - Inicial",
    "1.º de Primaria",
    "2.º de Primaria",
    "3.º de Primaria",
    "4.º de Primaria",
    "5.º de Primaria",
    "6.º de Primaria"
  ];
  const CURSOS_ANTERIORES = ['Primero "A"', 'Segundo "A"', 'Tercero "A"', 'Cuarto "A"', 'Quinto "A"', 'Sexto "A"'];
  const TRIMESTRES = ["1er Trimestre", "2do Trimestre", "3er Trimestre"];
  let cursoVistaActual = localStorage.getItem("cursoSeleccionado") || "";
  let trimestrePanelAbierto = false;
  const edicionesAsistenciaSesion = new Set();

  function claveDeFecha() {
    return `${anio}-${mes.toString().padStart(2, "0")}-${dia.toString().padStart(2, "0")}`;
  }

  function trimestreActual() {
    return localStorage.getItem("trimestreActual") || "1er Trimestre";
  }

  function etiquetaTrimestre(valor) {
    return { "1er Trimestre": "1er trimestre", "2do Trimestre": "2do trimestre", "3er Trimestre": "3er trimestre" }[valor] || valor;
  }

  function esDocente() {
    return sessionStorage.getItem("sesionRol") === "docente";
  }

  function modoAsistenciaDocente() {
    return localStorage.getItem("modoAsistenciaDocente") || "registro";
  }

  function esModoResumenDocente() {
    return esDocente() && modoAsistenciaDocente() === "resumen";
  }

  function actualizarClaseModoAsistencia() {
    document.body.classList.toggle("readonly-attendance", esVistaSoloLectura());
    document.body.classList.toggle("summary-attendance", esModoResumenDocente());
  }

  function controlesModoAsistenciaDocente() {
    if (!esDocente()) return "";
    const modo = modoAsistenciaDocente();
    return `
      <div class="attendance-mode-switch" aria-label="Modo de asistencia">
        <button type="button" class="${modo === "registro" ? "active" : ""}" onclick="cambiarModoAsistenciaDocente('registro')">
          <i class="bi bi-pencil-square"></i> Tomar lista
        </button>
        <button type="button" class="${modo === "resumen" ? "active" : ""}" onclick="cambiarModoAsistenciaDocente('resumen')">
          <i class="bi bi-table"></i> Resumen
        </button>
      </div>
    `;
  }

  function cambiarModoAsistenciaDocente(modo) {
    localStorage.setItem("modoAsistenciaDocente", modo);
    actualizarClaseModoAsistencia();
    renderTrimestrePanel();
    if (modo === "resumen") mostrarAsistenciaMensual();
    else mostrarInformacion();
  }

  function etiquetaCursoCorta(curso) {
    if (/pre\s*inicial|inicial/i.test(curso)) return "Inicial";
    const match = String(curso || "").match(/([1-6])\s*\./);
    const mapa = { 1: "1ro", 2: "2do", 3: "3ro", 4: "4to", 5: "5to", 6: "6to" };
    return match ? mapa[match[1]] : curso;
  }

  function colorCursoPastel(color) {
    const limpio = String(color || "").replace("#", "");
    if (!/^[0-9a-f]{6}$/i.test(limpio)) return "#eef7ff";
    const r = parseInt(limpio.slice(0, 2), 16);
    const g = parseInt(limpio.slice(2, 4), 16);
    const b = parseInt(limpio.slice(4, 6), 16);
    return `rgb(${Math.round(r + (255 - r) * .84)}, ${Math.round(g + (255 - g) * .84)}, ${Math.round(b + (255 - b) * .84)})`;
  }

  function leerJSON(clave, inicial = {}) {
    try {
      const valor = localStorage.getItem(clave);
      return valor ? JSON.parse(valor) : inicial;
    } catch (error) {
      return inicial;
    }
  }


  function nombreAlumno(item) {
    return typeof item === "string" ? item : String(item?.nombre || "").trim();
  }

  function alumnoActivo(item) {
    return typeof item === "string" ? true : item?.activo !== false;
  }

  function nombresAlumnosCurso(curso, soloActivos = true) {
    const lista = leerJSON("alumnos", {})[curso] || [];
    return lista
      .filter(item => !soloActivos || alumnoActivo(item))
      .map(nombreAlumno)
      .filter(Boolean);
  }

  function docenteActualNombre() {
    return sessionStorage.getItem("docenteNombre") || sessionStorage.getItem("docenteUsuario") || "Docente";
  }

  function docenteActualUsuario() {
    return sessionStorage.getItem("docenteUsuario") || docenteActualNombre();
  }

  function horarioBaseParaCurso(curso) {
    const horarioCurso = leerJSON(`horario_${curso}`, []);
    if (Array.isArray(horarioCurso) && horarioCurso.length) return horarioCurso;
    if (curso !== "Pre Inicial - Inicial") {
      const horasPrimaria = leerJSON("horasPrimaria", []);
      if (Array.isArray(horasPrimaria) && horasPrimaria.length) return horasPrimaria;
    }
    return curso === "Pre Inicial - Inicial"
      ? [{ periodo:"1", hora:"08:00 - 08:40" }, { periodo:"2", hora:"08:40 - 09:20" }]
      : [{ periodo:"1", hora:"07:30 - 08:10" }, { periodo:"2", hora:"08:10 - 08:50" }];
  }

  function minutosDesdeHora(hora) {
    const match = String(hora || "").match(/(\d{1,2}):(\d{2})/);
    if (!match) return null;
    return Number(match[1]) * 60 + Number(match[2]);
  }

  function finSegundoPeriodo(curso) {
    const periodos = horarioBaseParaCurso(curso).filter(fila =>
      !fila.recreo && !String(fila.periodo || "").toLowerCase().includes("recreo")
    );
    const segundo = periodos[1] || periodos[0];
    const partesHora = String(segundo?.hora || "").split("-");
    return minutosDesdeHora(partesHora[1] || partesHora[0]);
  }

  function asistenciaBloqueadaPorHorario(curso) {
    if (!esHoy) return true;
    const fin = finSegundoPeriodo(curso);
    if (fin === null) return false;
    const ahora = new Date();
    const minutosAhora = ahora.getHours() * 60 + ahora.getMinutes();
    return minutosAhora > fin;
  }

  function puedeEditarAsistencia(curso, modoEdicion) {
    return !esVistaSoloLectura() && (modoEdicion || !asistenciaBloqueadaPorHorario(curso));
  }

  function claveEdicionAsistencia(curso) {
    return `${claveDeFecha()}|${curso}`;
  }

  function registrarEdicionAsistencia(curso) {
    const clave = claveEdicionAsistencia(curso);
    if (edicionesAsistenciaSesion.has(clave)) return;
    edicionesAsistenciaSesion.add(clave);
    const historial = leerJSON("asistenciaEdiciones", {});
    if (!Array.isArray(historial[clave])) historial[clave] = [];
    historial[clave].push({
      fecha: claveDeFecha(),
      curso,
      docente: docenteActualNombre(),
      usuario: docenteActualUsuario(),
      hora: new Date().toLocaleString("es-BO")
    });
    localStorage.setItem("asistenciaEdiciones", JSON.stringify(historial));
  }

  function renderHistorialEdicionAsistencia(curso) {

    if (!document.getElementById("modalClaveDocente")) {
      document.body.insertAdjacentHTML("beforeend", `

  async function guardarCambioClaveDocente(event) {
    event.preventDefault();
    if (!window.requireInternetForFirebase("Conecte a internet para cambiar su contrasena.")) return;
    const actual = document.getElementById("claveActualDocente").value;
    const nueva = document.getElementById("claveNuevaDocente").value;
    const confirmar = document.getElementById("claveConfirmarDocente").value;
    const mensaje = document.getElementById("mensajeClaveDocente");
    const usuario = sessionStorage.getItem("docenteUsuario");
    const docentes = leerJSON("docentes", []);
    const docente = docentes.find(item => item.usuario === usuario);

    function error(texto) {
      mensaje.textContent = texto;
      mensaje.classList.remove("d-none");
    }

    if (!docente) return error("No se encontro la cuenta docente.");
    if (docente.clave !== actual) return error("La contrasena actual no es correcta.");
    if (nueva.length < 4) return error("La contrasena nueva debe tener al menos 4 caracteres.");
    if (nueva !== confirmar) return error("La confirmacion no coincide.");

    docente.clave = nueva;
    guardarJSON("docentes", docentes);
    const guardado = window.firebaseMarkPackage ? await window.firebaseMarkPackage("docentes") : true;
    if (guardado === false) return error("No se pudo guardar en Firebase. Revise la conexion.");
    bootstrap.Modal.getInstance(document.getElementById("modalClaveDocente")).hide();
    alert("Contrasena actualizada correctamente.");
  }

  function etiquetaEstado(estado) {
    return {
      blanco: "F",
      verde: "P",
      amarillo: "A",
      morado: "L"
    }[estado] || "F";
  }

  function cuentaComoRegistro(estado) {
    return ["verde", "amarillo", "morado"].includes(estado);
  }

  function claseEstadoTabla(estado, registrado) {
    if (!registrado) return "estado-blanco";
    if (estado === "blanco") return "estado-rojo";
    return {
      verde: "estado-verde",
      amarillo: "estado-amarillo",
      morado: "estado-morado"
    }[estado] || "estado-blanco";
  }

  function fechaEsHabil(fechaISO) {
    const [yy, mm, dd] = fechaISO.split("-").map(Number);
    const diaSemana = new Date(yy, mm - 1, dd).getDay();
    return diaSemana >= 1 && diaSemana <= 5;
  }

  function etiquetaFechaCorta(fechaISO) {
    const [yy, mm, dd] = fechaISO.split("-").map(Number);
    const nombres = ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"];
    const fecha = new Date(yy, mm - 1, dd);
    return `${nombres[fecha.getDay()]} ${dd}`;
  }

  function etiquetaMes(fechaISO) {
    const [yy, mm] = fechaISO.split("-").map(Number);
    return new Date(yy, mm - 1, 1).toLocaleDateString("es-ES", { month:"long", year:"numeric" });
  }

  function grupoMeses(fechas) {
    return fechas.reduce((acc, fecha) => {
      const mesClave = fecha.slice(0, 7);
      if (!acc[mesClave]) acc[mesClave] = [];
      acc[mesClave].push(fecha);
      return acc;
    }, {});
  }

  function estiloTablaAsistencia(alumnos, cantidadFechas) {
    const nombreMayor = alumnos.reduce((max, nombre) => Math.max(max, String(nombre || "").length), 0);
    const anchoNombre = Math.max(132, Math.min(230, Math.ceil(nombreMayor * 7.1) + 18));
    const anchoTabla = Math.max(560, 38 + anchoNombre + (cantidadFechas * 42) + 170);
    return `--attendance-name-width:${anchoNombre}px;--attendance-table-min:${anchoTabla}px`;
  }

  function estadoCuentaAsistencia(estado) {
    return ["verde", "morado"].includes(estado);
  }

  function normalizarAsignacionesDocente(docente) {
    if (Array.isArray(docente?.asignaciones) && docente.asignaciones.length) {
      return docente.asignaciones.map(asig => ({
        curso: asig.curso,
        materias: Array.isArray(asig.materias) ? asig.materias : []
      })).filter(asig => asig.curso && asig.materias.length);
    }
    const materias = Array.isArray(docente?.materias) && docente.materias.length
      ? docente.materias
      : [docente?.materia].filter(Boolean);
    return docente?.curso && materias.length ? [{ curso: docente.curso, materias }] : [];
  }

  function guardarSesionDocenteDesdeCuenta(docente) {
    const asignaciones = normalizarAsignacionesDocente(docente);
    const cursos = [...new Set(asignaciones.map(asig => asig.curso).filter(Boolean))];
    const materias = asignaciones[0]?.materias || [];
    sessionStorage.setItem("docenteNombre", docente.nombre || sessionStorage.getItem("docenteNombre") || "");
    sessionStorage.setItem("docenteCurso", cursos[0] || "");
    sessionStorage.setItem("docenteCursos", JSON.stringify(cursos));
    sessionStorage.setItem("docenteMateria", materias[0] || "");
    sessionStorage.setItem("docenteMaterias", JSON.stringify(materias));
    sessionStorage.setItem("docenteAsignaciones", JSON.stringify(asignaciones));
    return asignaciones;
  }

  function asignacionesDocente() {
    if (sessionStorage.getItem("sesionRol") !== "docente") return [];
    const usuario = sessionStorage.getItem("docenteUsuario");
    const docente = leerJSON("docentes", []).find(item => item.usuario === usuario);
    if (docente) return guardarSesionDocenteDesdeCuenta(docente);
    try {
      const asignaciones = JSON.parse(sessionStorage.getItem("docenteAsignaciones") || "[]");
      if (Array.isArray(asignaciones) && asignaciones.length) return asignaciones;
    } catch (error) {}
    const curso = sessionStorage.getItem("docenteCurso");
    let materias = [];
    try { materias = JSON.parse(sessionStorage.getItem("docenteMaterias") || "[]"); }
    catch (error) { materias = [sessionStorage.getItem("docenteMateria")].filter(Boolean); }
    return curso ? [{ curso, materias }] : [];
  }

  function cursosDocenteAsignados() {
    return [...new Set(asignacionesDocente().map(asig => asig.curso).filter(Boolean))];
  }

  function cambiarMesResumen(delta) {
    const nueva = new Date(anio, mes - 1 + delta, 1);
    anio = nueva.getFullYear();
    mes = nueva.getMonth() + 1;
    mostrarAsistenciaMensual();
  }

  function seleccionarCursoResumen(curso) {
    cursoVistaActual = curso;
    localStorage.setItem("cursoSeleccionado", curso);
    if (esVistaSoloLectura() || esModoResumenDocente()) mostrarAsistenciaMensual();
    else mostrarInformacion();
  }

  function cursosOficialesVisibles(alumnosPorCurso) {
    const guardados = JSON.parse(localStorage.getItem("cursos") || "[]");
    const extras = guardados.filter(curso =>
      !CURSOS_DEFAULT.includes(curso) &&
      !CURSOS_ANTERIORES.includes(curso) &&
      (alumnosPorCurso[curso] || []).length
    );
    const cursos = [...new Set([...CURSOS_DEFAULT, ...extras])];
    if (JSON.stringify(guardados) !== JSON.stringify(cursos)) {
      localStorage.setItem("cursos", JSON.stringify(cursos));
    }
    return cursos;
  }

  function mostrarAsistenciaMensual() {
    actualizarClaseModoAsistencia();
    document.querySelectorAll("#slideContainer > .d-flex.justify-content-between.mb-3").forEach(el => el.style.display = "none");
    const alumnosPorCurso = JSON.parse(localStorage.getItem("alumnos")) || {};
    const asistencias = JSON.parse(localStorage.getItem("asistencias")) || {};
    const trimestresAsistencia = JSON.parse(localStorage.getItem("trimestresAsistencia")) || {};
    const coloresCursos = JSON.parse(localStorage.getItem("cursoColores")) || {};
    const colorCurso = curso => coloresCursos[curso] || "#12355b";
    let cursos = cursosOficialesVisibles(alumnosPorCurso);
    if (esDocente()) {
      const permitidos = cursosDocenteAsignados();
      const filtrados = cursos.filter(curso => permitidos.includes(curso));
      cursos = filtrados.length ? filtrados : permitidos;
    }
    if (!cursoVistaActual || !cursos.includes(cursoVistaActual)) cursoVistaActual = cursos[0] || "";

    const trimestre = trimestreActual();
    document.getElementById("tituloDia").innerText = `Asistencias - ${etiquetaTrimestre(trimestre)}`;
    document.querySelector("#slideContainer h6").textContent = "Resumen trimestral por curso";
    const detalleContainer = document.getElementById("detalleCursos");

    if (!cursos.length) {
      detalleContainer.innerHTML = '<div class="alert alert-info text-center">No hay cursos registrados.</div>';
      return;
    }

    const alumnos = nombresAlumnosCurso(cursoVistaActual);
    const fechasRegistradas = [...new Set(Object.keys(asistencias)
      .map(clave => clave.split("|"))
      .filter(partes => partes.length >= 3 && partes[1] === cursoVistaActual)
      .map(partes => partes[0])
      .filter(fecha => fechaEsHabil(fecha))
      .filter(fecha => (trimestresAsistencia[fecha] || "") === trimestre)
      .filter(fecha => alumnos.some(nombre => cuentaComoRegistro(asistencias[`${fecha}|${cursoVistaActual}|${nombre}`] || "blanco")))
    )].sort();

    const meses = grupoMeses(fechasRegistradas);
    const mesesOrdenados = Object.keys(meses).sort();
    const totalColumnasFechas = fechasRegistradas.length;
    const estiloTabla = estiloTablaAsistencia(alumnos, totalColumnasFechas);

    let html = `
      <div class="course-tabs-bar">
        ${cursos.map(curso => `<button class="course-tab ${curso === cursoVistaActual ? "active" : ""}" title="${curso}" style="${curso === cursoVistaActual ? `border-color:${colorCurso(curso)}; color:${colorCurso(curso)}; background:${colorCursoPastel(colorCurso(curso))};` : `border-color:${colorCurso(curso)};`}" onclick="seleccionarCursoResumen('${String(curso).replaceAll("\\", "\\\\").replaceAll("'", "\\'").replaceAll('"', "&quot;")}')">${etiquetaCursoCorta(curso)}</button>`).join("")}
      </div>
      <div class="trimester-summary compact" style="border-left-color:${colorCurso(cursoVistaActual)}">
        <div>
          <div class="title">${cursoVistaActual}</div>
          <div class="small text-muted fw-bold">${etiquetaTrimestre(trimestre)} - ${totalColumnasFechas} fechas registradas</div>
        </div>
      </div>
    `;

    if (!alumnos.length) {
      detalleContainer.innerHTML = html + '<div class="alert alert-info text-center">No hay alumnos registrados en este curso.</div>';
      return;
    }

    if (!fechasRegistradas.length) {
      detalleContainer.innerHTML = html + `<div class="alert alert-info text-center">No hay asistencias registradas en ${etiquetaTrimestre(trimestre)} para este curso.</div>`;
      return;
    }

    html += `
      <div class="attendance-actions">
        <button class="btn btn-outline-dark btn-sm" type="button" onclick="imprimirResumenAsistencia()">
          <i class="bi bi-printer-fill"></i> Imprimir
        </button>
        <button class="btn btn-success btn-sm" type="button" onclick="exportarResumenAsistenciaExcel()">
          <i class="bi bi-file-earmark-spreadsheet-fill"></i> Excel
        </button>
      </div>
      <div class="attendance-wrap">
        <table class="attendance-table" style="${estiloTabla}">
          <thead>
            <tr>
              <th class="index-col" rowspan="2">N°</th>
              <th class="student-col" rowspan="2">Alumno</th>
              ${mesesOrdenados.map(mesClave => `<th class="month-head" colspan="${meses[mesClave].length}">${etiquetaMes(`${mesClave}-01`)}</th>`).join("")}
              <th class="total-head" rowspan="2">P</th>
              <th class="total-head" rowspan="2">A</th>
              <th class="total-head" rowspan="2">L</th>
              <th class="total-head" rowspan="2">F</th>
            </tr>
            <tr>
              ${fechasRegistradas.map(fecha => `<th class="date-head">${etiquetaFechaCorta(fecha)}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
    `;

    alumnos.forEach((nombre, index) => {
      const totales = { asistencia: 0, atrasos: 0, permisos: 0, faltas: 0 };
      html += `<tr><td class="index-col">${index + 1}</td><td class="student-col fw-bold">${nombre}</td>`;
      fechasRegistradas.forEach(fecha => {
        const estado = asistencias[`${fecha}|${cursoVistaActual}|${nombre}`] || "blanco";
        if (estado === "morado") {
          totales.asistencia++;
          totales.permisos++;
        }
        else if (estado === "verde") totales.asistencia++;
        else if (estado === "amarillo") totales.atrasos++;
        else totales.faltas++;
        html += `<td class="attendance-cell ${claseEstadoTabla(estado, true)}">${etiquetaEstado(estado)}</td>`;
      });
      html += `
        <td class="total-cell">${totales.asistencia}</td>
        <td class="total-cell">${totales.atrasos}</td>
        <td class="total-cell">${totales.permisos}</td>
        <td class="total-cell">${totales.faltas}</td>
      </tr>`;
    });

    html += "</tbody></table></div>";
    detalleContainer.innerHTML = html;
    activarSeleccionFilasAsistencia();
  }

  function nombreArchivoSeguro(texto) {
    return String(texto || "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/gi, "_")
      .replace(/^_+|_+$/g, "")
      .toLowerCase();
  }

  function tablaResumenAsistenciaActual() {
    return document.querySelector("#detalleCursos .attendance-table");
  }

  function tituloResumenAsistencia() {
    return `Asistencia - ${cursoVistaActual || "Curso"} - ${etiquetaTrimestre(trimestreActual())}`;
  }

  function imprimirResumenAsistencia() {
    const tabla = tablaResumenAsistenciaActual();
    if (!tabla) return alert("No hay tabla de asistencia para imprimir.");
    const ventana = window.open("", "_blank");
    if (!ventana) return alert("No se pudo abrir la ventana de impresion.");
    ventana.document.write(`
      <!doctype html>
      <html lang="es">
      <head>
        <meta charset="UTF-8">
        <title>${escaparHTML(tituloResumenAsistencia())}</title>
        <style>
          @page { size: letter landscape; margin: 8mm; }
          body { color:#111; font-family:Arial, sans-serif; margin:0; }
          h1 { font-size:16px; margin:0 0 4px; text-align:center; }
          .meta { font-size:11px; font-weight:700; margin-bottom:8px; text-align:center; }
          table { border-collapse:collapse; font-size:9px; width:100%; }
          th, td { border:1px solid #222; padding:3px 4px; text-align:center; vertical-align:middle; }
          th { background:#e9eef5; font-weight:900; }
          .student-col { text-align:left; white-space:nowrap; }
          .estado-verde { background:#d4edda; }
          .estado-amarillo { background:#fff3cd; }
          .estado-morado { background:#e0c3fc; }
          .estado-rojo, .estado-blanco { background:#f8d7da; }
          .total-cell { background:#f8fafc; font-weight:900; }
        </style>
      </head>
      <body>
        <h1>${escaparHTML(tituloResumenAsistencia())}</h1>
        <div class="meta">Generado: ${new Date().toLocaleString("es-BO")}</div>
        ${tabla.outerHTML}
      </body>
      </html>
    `);
    ventana.document.close();
    ventana.focus();
    setTimeout(() => {
      ventana.print();
      ventana.close();
    }, 250);
  }

  function exportarResumenAsistenciaExcel() {
    const tabla = tablaResumenAsistenciaActual();
    if (!tabla) return alert("No hay tabla de asistencia para exportar.");
    const html = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
      <head><meta charset="UTF-8"></head>
      <body>
        <h3>${escaparHTML(tituloResumenAsistencia())}</h3>
        ${tabla.outerHTML}
      </body>
      </html>
    `;
    const blob = new Blob([html], { type:"application/vnd.ms-excel;charset=utf-8" });
    const enlace = document.createElement("a");
    enlace.href = URL.createObjectURL(blob);
    enlace.download = `${nombreArchivoSeguro(tituloResumenAsistencia()) || "asistencia"}.xls`;
    document.body.appendChild(enlace);
    enlace.click();
    URL.revokeObjectURL(enlace.href);
    enlace.remove();
  }

  function activarSeleccionFilasAsistencia() {
    document.querySelectorAll(".attendance-table tbody tr").forEach(fila => {
      fila.addEventListener("click", () => {
        document.querySelectorAll(".attendance-table tbody tr.row-selected").forEach(item => {
          if (item !== fila) item.classList.remove("row-selected");
        });
        fila.classList.toggle("row-selected");
      });
    });
  }

  function cambiarDia(delta) {
    let nuevaFecha = new Date(anio, mes - 1, dia + delta);
    while (nuevaFecha.getDay() === 0 || nuevaFecha.getDay() === 6) {
      nuevaFecha.setDate(nuevaFecha.getDate() + (delta > 0 ? 1 : -1));
    }
    anio = nuevaFecha.getFullYear();
    mes = nuevaFecha.getMonth() + 1;
    dia = nuevaFecha.getDate();
    window.location.href = `dia.html?anio=${anio}&mes=${mes}&dia=${dia}`;
  }

  function animarCambio(delta) {
    const cont = document.getElementById("slideContainer");
    cont.classList.add(delta > 0 ? "slide-left" : "slide-right");
    setTimeout(() => cambiarDia(delta), 400);
  }

  function mostrarInformacion(modoEdicion = false) {
    actualizarClaseModoAsistencia();
    document.querySelectorAll("#slideContainer > .d-flex.justify-content-between.mb-3").forEach(el => el.style.display = "");
    const subtitulo = document.querySelector("#slideContainer h6");
    if (subtitulo) subtitulo.textContent = "Codigo de colores";
    if (docenteSinInternet()) {
      mostrarBloqueoAsistenciaSinInternet();
      return;
    }
    const fecha = new Date(anio, mes - 1, dia);
    document.getElementById("tituloDia").innerText =
      `${diasSemana[fecha.getDay()]}, ${dia} de ${nombreMeses[mes - 1]} de ${anio}`;

    const detalleContainer = document.getElementById("detalleCursos");
    detalleContainer.innerHTML = "";

    const alumnosPorCurso = JSON.parse(localStorage.getItem("alumnos")) || {};
    const asistencias = JSON.parse(localStorage.getItem("asistencias")) || {};
    const coloresCursos = JSON.parse(localStorage.getItem("cursoColores")) || {};
    const colorCurso = curso => coloresCursos[curso] || "#12355b";
    let cursos = Object.keys(alumnosPorCurso);
    if (sessionStorage.getItem("sesionRol") === "docente") {
      const permitidos = cursosDocenteAsignados();
      const filtrados = cursos.filter(curso => permitidos.includes(curso));
      cursos = filtrados.length ? filtrados : permitidos;
    }

    if (cursos.length === 0) {
      detalleContainer.innerHTML = `<p class="text-muted text-center">No hay cursos asignados.</p>`;
      return;
    }

    if (!cursoVistaActual || !cursos.includes(cursoVistaActual)) cursoVistaActual = cursos[0];
    localStorage.setItem("cursoSeleccionado", cursoVistaActual);
    detalleContainer.innerHTML = `
      <div class="course-tabs-bar">
        ${cursos.map(curso => `<button class="course-tab ${curso === cursoVistaActual ? "active" : ""}" title="${curso}" style="${curso === cursoVistaActual ? `border-color:${colorCurso(curso)}; color:${colorCurso(curso)}; background:${colorCursoPastel(colorCurso(curso))};` : `border-color:${colorCurso(curso)};`}" onclick="seleccionarCursoResumen('${String(curso).replaceAll("\\", "\\\\").replaceAll("'", "\\'").replaceAll('"', "&quot;")}')">${etiquetaCursoCorta(curso)}</button>`).join("")}
      </div>
    `;

    [cursoVistaActual].forEach(curso => {
      const div = document.createElement("div");
      div.className = "curso-card";
      div.style.borderTopColor = colorCurso(curso);

      const listaAlumnos = nombresAlumnosCurso(curso);
      const bloqueada = asistenciaBloqueadaPorHorario(curso);
      const editable = puedeEditarAsistencia(curso, modoEdicion);
      const totales = listaAlumnos.reduce((acc, nombre) => {
        const estado = asistencias[`${claveDeFecha()}|${curso}|${nombre}`] || "blanco";
        acc[estado] = (acc[estado] || 0) + 1;
        return acc;
      }, { blanco: 0, verde: 0, amarillo: 0, morado: 0 });
      const diaRegistrado = listaAlumnos.some(nombre => cuentaComoRegistro(asistencias[`${claveDeFecha()}|${curso}|${nombre}`] || "blanco"));

      div.innerHTML = `
        ${diaRegistrado ? `
          <div class="total-strip">
            <span class="total-chip estado-verde">Presentes: ${totales.verde || 0}</span>
            <span class="total-chip estado-amarillo">Atrasos: ${totales.amarillo || 0}</span>
            <span class="total-chip estado-morado">Permisos: ${totales.morado || 0}</span>
            <span class="total-chip estado-blanco border">Faltas: ${totales.blanco || 0}</span>
          </div>
        ` : '<div class="alert alert-info py-2 mb-2">Dia sin registro de asistencia.</div>'}
        ${bloqueada && !modoEdicion ? '<div class="attendance-lock-note"><i class="bi bi-lock-fill"></i> Asistencia bloqueada despues del segundo periodo. Para corregir, usa Editar asistencia.</div>' : ""}
        ${modoEdicion && bloqueada ? '<div class="attendance-lock-note"><i class="bi bi-unlock-fill"></i> Modo edicion activo. La correccion quedara registrada con el docente.</div>' : ""}
        ${renderHistorialEdicionAsistencia(curso)}
      `;

      if (listaAlumnos.length === 0) {
        div.innerHTML += `<p class="text-muted">No hay alumnos registrados en este curso.</p>`;
      } else if (esVistaSoloLectura() && !diaRegistrado) {
        div.innerHTML += "";
      } else {
        listaAlumnos.forEach(nombre => {
          const claveAlumno = `${claveDeFecha()}|${curso}|${nombre}`;
          const estado = asistencias[claveAlumno] || "blanco";

          const estadoColor = {
            blanco: "estado-blanco",
            verde: "estado-verde",
            amarillo: "estado-amarillo",
            morado: "estado-morado"
          }[estado];

          const divAlumno = document.createElement("div");
          divAlumno.className = `asistencia-item ${estadoColor}`;
          divAlumno.innerHTML = `
            <span>${nombre}</span>
            <span class="readonly-badge ${estadoColor}">${etiquetaEstado(estado)}</span>
          `;

          if (editable) {
            divAlumno.onclick = () => {
              if (docenteSinInternet()) {
                mostrarBloqueoAsistenciaSinInternet();
                return;
              }
              const nuevoEstado = obtenerSiguienteEstado(estado);
              asistencias[claveAlumno] = nuevoEstado;
              localStorage.setItem("asistencias", JSON.stringify(asistencias));
              if (bloqueada || modoEdicion) registrarEdicionAsistencia(curso);
              const trimestresAsistencia = JSON.parse(localStorage.getItem("trimestresAsistencia")) || {};
              trimestresAsistencia[claveDeFecha()] = trimestreActual();
              localStorage.setItem("trimestresAsistencia", JSON.stringify(trimestresAsistencia));
              mostrarInformacion(modoEdicion);
            };
          }

          div.appendChild(divAlumno);
        });
      }

      detalleContainer.appendChild(div);
    });

    if (!esVistaSoloLectura() && !modoEdicion && (!esHoy || asistenciaBloqueadaPorHorario(cursoVistaActual))) {
      const btnEditar = document.createElement("button");
      btnEditar.className = "btn btn-sm btn-warning mt-3";
      btnEditar.textContent = "Editar asistencia";
      btnEditar.onclick = () => {
        if (docenteSinInternet()) {
          mostrarBloqueoAsistenciaSinInternet();
          return;
        }
        mostrarInformacion(true);
      };
      detalleContainer.appendChild(btnEditar);
    }
  }

  function obtenerSiguienteEstado(estadoActual) {
    switch (estadoActual) {
      case "blanco": return "verde";
      case "verde": return "amarillo";
      case "amarillo": return "morado";
      case "morado": return "blanco";
      default: return "blanco";
    }
  }

  renderNavbar();
  renderTrimestrePanel();
  if (esVistaSoloLectura() || esModoResumenDocente()) mostrarAsistenciaMensual();
  else mostrarInformacion();
  window.addEventListener("offline", () => {
    if (esDocente() && !esModoResumenDocente()) mostrarBloqueoAsistenciaSinInternet();
  });
  window.addEventListener("online", () => {
    const overlay = document.getElementById("internetRequiredOverlay");
    if (overlay) overlay.remove();
    if (esDocente()) {
      if (esModoResumenDocente()) mostrarAsistenciaMensual();
      else mostrarInformacion();
    }
  });
</script>
</body>
</html>
