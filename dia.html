<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asistencia del Día</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .app-navbar {
      background: #12355b;
      border-radius: 0;
      box-shadow: 0 6px 16px rgba(0,0,0,.14);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin: 0 calc(50% - 50vw) 18px;
      min-height: 58px;
      padding: 10px 24px;
      width: 100vw;
    }

    .app-navbar a,
    .app-navbar button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      min-height: 38px;
      padding: 8px 14px;
      text-decoration: none;
    }

    .app-navbar .active {
      background: #fff;
      color: #12355b;
    }
    .nav-spacer { flex: 1 1 auto; }
    .user-nav { background:rgba(255,255,255,.18)!important; border-color:rgba(255,255,255,.38)!important; cursor:pointer; }
    .user-nav small { display:block; font-size:10px; font-weight:700; line-height:1; opacity:.85; }
    .docente-navbar { justify-content:flex-start; align-items:center; }
    .docente-navbar .nav-visible { display:flex; flex:1 1 auto; flex-wrap:wrap; gap:8px; align-items:center; }
    .docente-navbar .nav-menu { flex-basis:100%; gap:8px; padding-top:8px; }
    .docente-navbar .nav-menu.show,
    .docente-navbar .nav-menu.collapsing { display:flex!important; flex-wrap:wrap; }
    .nav-priority { font-size:15px; padding-inline:18px!important; }
    .nav-toggler { margin-left:auto; background:#fff!important; color:#12355b!important; border-color:#fff!important; min-width:46px; justify-content:center; }
    .nav-logout { background:#dc3545!important; border-color:#ffb3bd!important; color:#fff!important; }
    .nav-logout:hover { background:#bb2d3b!important; }
    .docente-sidebar { color:#213547; }
    .docente-sidebar .offcanvas-header { background:#12355b; color:#fff; }
    .docente-sidebar .btn-close { filter:invert(1) grayscale(1); opacity:.9; }
    .sidebar-eyebrow { font-size:11px; font-weight:900; opacity:.75; text-transform:uppercase; }
    .sidebar-actions { display:grid; gap:10px; }
    .sidebar-actions a,
    .sidebar-actions button { align-items:center; background:#f8fafc!important; border:1px solid #dbe7ef!important; border-radius:8px; color:#12355b!important; display:flex; font-weight:900; gap:10px; justify-content:flex-start; min-height:48px; padding:10px 14px; text-decoration:none; width:100%; }
    .sidebar-actions a.active,
    .sidebar-actions button.active { background:#12355b!important; border-color:#12355b!important; color:#fff!important; }
    .sidebar-actions .user-nav { background:#eef5ff!important; border-color:#bfd4ea!important; }
    .sidebar-actions .nav-logout { background:#dc3545!important; border-color:#dc3545!important; color:#fff!important; margin-top:8px; }
    .sidebar-actions .nav-logout:hover { background:#bb2d3b!important; }
    .director-navbar { align-items:center; justify-content:flex-start; }
    .director-brand { align-items:center; color:#fff; display:inline-flex; font-weight:900; gap:8px; letter-spacing:.3px; }
    .director-menu-btn { background:#fff!important; border-color:#fff!important; color:#12355b!important; justify-content:center; margin-left:auto; min-width:46px; }
    .director-sidebar { background:#12355b; color:#fff; max-width:96px; }
    .director-sidebar .offcanvas-header { border-bottom:1px solid rgba(255,255,255,.18); justify-content:center; padding:12px 8px; }
    .director-sidebar .btn-close { filter:invert(1) grayscale(1); opacity:.9; }
    .director-icon-nav { display:grid; gap:12px; justify-items:center; }
    .director-icon-nav a,
    .director-icon-nav button { align-items:center; background:rgba(255,255,255,.12)!important; border:1px solid rgba(255,255,255,.25)!important; border-radius:14px; color:#fff!important; display:inline-flex; font-size:23px; height:54px; justify-content:center; padding:0!important; width:54px; }
    .director-icon-nav .active { background:#fff!important; color:#12355b!important; }
    .director-icon-nav .director-logout { background:#dc3545!important; border-color:#ffb3bd!important; margin-top:6px; }
    .trimestre-panel {
      background: #fff;
      border: 1px solid #dbe7ef;
      border-left: 8px solid #12355b;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(30,60,90,.08);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 12px 14px;
    }
    .trimestre-panel .label {
      color: #12355b;
      font-weight: 900;
    }
    .trimestre-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      min-width: 260px;
      overflow: hidden;
    }
    .trimestre-options {
      display: flex;
      gap: 8px;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateX(24px);
      transition: max-width .28s ease, opacity .2s ease, transform .28s ease;
      white-space: nowrap;
    }
    .trimestre-picker.open .trimestre-options {
      max-width: 520px;
      opacity: 1;
      transform: translateX(0);
    }
    .trimestre-btn {
      background: #eef5ff;
      border: 2px solid #cfe2ff;
      border-radius: 8px;
      color: #12355b;
      font-weight: 900;
      padding: 8px 14px;
    }
    .trimestre-current {
      background: #12355b;
      border: 2px solid #12355b;
      border-radius: 8px;
      color: #fff;
      font-weight: 900;
      min-width: 150px;
      padding: 8px 14px;
    }
    .trimestre-btn.active {
      background: #12355b;
      border-color: #12355b;
      color: #fff;
      transform: scale(1.04);
    }

    #slideContainer > .d-flex.justify-content-between.mb-3:first-of-type {
      display: none !important;
    }

    .curso-card {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      background-color: #f8f9fa;
    }

    .asistencia-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      margin: 3px 0;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid black;
      transition: background-color 0.4s ease;
    }

    .estado-blanco { background-color: white; }
    .estado-verde { background-color: #d4edda; }
    .estado-amarillo { background-color: #fff3cd; }
    .estado-morado { background-color: #e0c3fc; }
    .estado-rojo { background-color: #f8d7da; color: #842029; }
    .readonly-badge { border-radius: 999px; font-weight: 900; min-width: 42px; padding: 4px 8px; text-align: center; }
    .total-strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .total-chip { border-radius: 999px; font-weight: 900; padding: 6px 10px; }
    .course-tabs-bar { align-items:flex-end; border-bottom:2px solid #dbe7ef; display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-bottom:14px; padding-top:10px; }
    .course-tab { background:#f8fafc; border:2px solid #d6e1eb; border-bottom:0; border-radius:9px 9px 0 0; color:#213547; font-size:14px; font-weight:900; margin-bottom:-2px; min-height:38px; min-width:66px; padding:8px 12px; transform-origin:center bottom; transition:background-color .7s ease, box-shadow .7s ease; }
    .course-tab.active { animation:courseTabRise .42s cubic-bezier(.22, .61, .36, 1) both; border-width:3px; box-shadow:0 -9px 18px rgba(18,53,91,.14); transform:translateY(-7px) scaleY(1.16); }
    @keyframes courseTabRise {
      0% { box-shadow:0 -2px 8px rgba(18,53,91,.05); transform:translateY(0) scaleY(1); }
      45% { box-shadow:0 -5px 13px rgba(18,53,91,.09); transform:translateY(-3.9px) scaleY(1.09); }
      100% { box-shadow:0 -9px 18px rgba(18,53,91,.14); transform:translateY(-7px) scaleY(1.16); }
    }
    .curso-card { border-top:6px solid #12355b; }
    .month-switch { background:#eef5ff; border:2px solid #bfd4ea; border-radius:14px; display:inline-flex; align-items:center; gap:10px; padding:8px 12px; box-shadow:0 8px 18px rgba(18,53,91,.08); }
    .month-label { color:#12355b; font-size:1.15rem; font-weight:900; min-width:190px; text-align:center; text-transform:capitalize; }
    .month-arrow { width:42px; height:42px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:1.2rem; }
    .attendance-wrap { max-height:72vh; overflow:auto; border:1px solid #dbe7ef; border-radius:8px; background:#fff; }
    .attendance-table { border-collapse:collapse; font-size:12px; min-width:900px; width:100%; }
    .attendance-table th, .attendance-table td { border:1px solid #d8e1ea; min-width:34px; padding:6px; text-align:center; vertical-align:middle; }
    .attendance-table thead th { background:#12355b; color:#fff; position:sticky; top:0; z-index:2; }
    .attendance-table .student-col { background:#fff; color:#213547; left:0; min-width:240px; position:sticky; text-align:left; z-index:3; }
    .attendance-cell { font-weight:900; }

    .leyenda {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .leyenda-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid black;
      border-radius: 5px;
    }

    .cuadro-color {
      width: 20px;
      height: 20px;
      border: 1px solid black;
    }

    .color-blanco { background-color: white; }
    .color-verde { background-color: #d4edda; }
    .color-amarillo { background-color: #fff3cd; }
    .color-morado { background-color: #e0c3fc; }

    /* Animaciones de deslizamiento */
    .slide-container {
      transition: transform 0.4s ease, opacity 0.4s ease;
    }
    .slide-left {
      transform: translateX(-100%);
      opacity: 0;
    }
    .slide-right {
      transform: translateX(100%);
      opacity: 0;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-sync.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12355b">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <script defer src="pwa.js"></script>
</head>
<body>
<script>
  if (sessionStorage.getItem("sesionDocente") !== "activa") {
    window.location.href = "index.html";
  }
</script>
<div class="container pt-4">
  <nav class="app-navbar" id="appNavbar"></nav>
  <section class="trimestre-panel" id="trimestrePanel"></section>
</div>
<div class="container py-4 slide-container" id="slideContainer">

  <!-- FILA 1: Navegación general -->
  <div class="d-flex justify-content-between mb-3">
    <button class="btn btn-outline-primary" onclick="volverAlInicio()"><i class="bi bi-house-door-fill"></i> Inicio</button>
    <button class="btn btn-outline-secondary" onclick="volverAlMes()"><i class="bi bi-calendar-check-fill"></i> Tareas</button>
  </div>

  <!-- FILA 2: Navegación entre días -->
  <div class="d-flex justify-content-between mb-3">
    <button class="btn btn-outline-dark" onclick="animarCambio(-1)"><i class="bi bi-arrow-left"></i> Dia anterior</button>
    <button class="btn btn-outline-dark" onclick="animarCambio(1)">Dia siguiente <i class="bi bi-arrow-right"></i></button>
  </div>

  <h2 id="tituloDia" class="mb-1 text-center"></h2>
   <h6 class="mb-1 text-center">Codigo de colores</h6>
  <!-- Leyenda de colores -->
  <div class="leyenda">
    <div class="leyenda-item color-blanco">Falta</div>
    <div class="leyenda-item color-verde">Asistencia</div>
    <div class="leyenda-item color-amarillo">Atraso</div>
    <div class="leyenda-item color-morado">Permiso</div>
  </div>

  <!-- Aquí se cargan los cursos y alumnos -->
  <div id="detalleCursos"></div>
</div>

<div class="modal fade" id="modalTrimestre" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Seleccionar trimestre</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="opcionesTrimestre" class="d-grid gap-2"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  let anio = parseInt(params.get("anio"));
  let mes = parseInt(params.get("mes"));
  let dia = parseInt(params.get("dia"));

  const nombreMeses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
                       "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const diasSemana = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

  const hoy = new Date();
  if (!anio) anio = hoy.getFullYear();
  if (!mes) mes = hoy.getMonth() + 1;
  if (!dia) dia = hoy.getDate();
  const esHoy = hoy.getFullYear() === anio &&
                hoy.getMonth() + 1 === mes &&
                hoy.getDate() === dia;
  const CURSOS_DEFAULT = [
    "Pre Inicial - Inicial",
    "1.º de Primaria",
    "2.º de Primaria",
    "3.º de Primaria",
    "4.º de Primaria",
    "5.º de Primaria",
    "6.º de Primaria"
  ];
  const CURSOS_ANTERIORES = ['Primero "A"', 'Segundo "A"', 'Tercero "A"', 'Cuarto "A"', 'Quinto "A"', 'Sexto "A"'];
  const TRIMESTRES = ["1er Trimestre", "2do Trimestre", "3er Trimestre"];
  let cursoVistaActual = localStorage.getItem("cursoSeleccionado") || "";
  let trimestrePanelAbierto = false;

  function claveDeFecha() {
    return `${anio}-${mes.toString().padStart(2, "0")}-${dia.toString().padStart(2, "0")}`;
  }

  function trimestreActual() {
    return localStorage.getItem("trimestreActual") || "1er Trimestre";
  }

  function etiquetaTrimestre(valor) {
    return { "1er Trimestre": "1er trimestre", "2do Trimestre": "2do trimestre", "3er Trimestre": "3er trimestre" }[valor] || valor;
  }

  function etiquetaCursoCorta(curso) {
    if (/pre\s*inicial|inicial/i.test(curso)) return "Inicial";
    const match = String(curso || "").match(/([1-6])\s*\./);
    const mapa = { 1: "1ro", 2: "2do", 3: "3ro", 4: "4to", 5: "5to", 6: "6to" };
    return match ? mapa[match[1]] : curso;
  }

  function colorCursoPastel(color) {
    const limpio = String(color || "").replace("#", "");
    if (!/^[0-9a-f]{6}$/i.test(limpio)) return "#eef7ff";
    const r = parseInt(limpio.slice(0, 2), 16);
    const g = parseInt(limpio.slice(2, 4), 16);
    const b = parseInt(limpio.slice(4, 6), 16);
    return `rgb(${Math.round(r + (255 - r) * .84)}, ${Math.round(g + (255 - g) * .84)}, ${Math.round(b + (255 - b) * .84)})`;
  }

  function cambiarTrimestre(valor) {
    if (valor === trimestreActual()) {
      trimestrePanelAbierto = false;
      bootstrap.Modal.getInstance(document.getElementById("modalTrimestre"))?.hide();
      renderTrimestrePanel();
      return;
    }
    if (!confirm(`Esta seguro que desea cambiar a ${valor}? Los registros nuevos de asistencia se guardaran en ese trimestre.`)) return;
    localStorage.setItem("trimestreActual", valor);
    trimestrePanelAbierto = false;
    bootstrap.Modal.getInstance(document.getElementById("modalTrimestre"))?.hide();
    renderTrimestrePanel();
    renderModalTrimestre();
    if (esVistaSoloLectura()) mostrarAsistenciaMensual();
    else mostrarInformacion();
  }

  function renderTrimestrePanel() {
    const actual = trimestreActual();
    document.getElementById("trimestrePanel").innerHTML = `
      <div>
        <div class="label"><i class="bi bi-bookmark-check-fill"></i> Trimestre activo</div>
        <div class="small text-muted fw-bold">Los registros nuevos se guardaran en ${etiquetaTrimestre(actual)}.</div>
      </div>
      <button class="trimestre-current" type="button" data-bs-toggle="modal" data-bs-target="#modalTrimestre">
        <i class="bi bi-pencil-square"></i> ${etiquetaTrimestre(actual)}
      </button>
    `;
    renderModalTrimestre();
  }

  function renderModalTrimestre() {
    const actual = trimestreActual();
    const contenedor = document.getElementById("opcionesTrimestre");
    if (!contenedor) return;
    contenedor.innerHTML = TRIMESTRES.map(tri => `
      <button type="button" class="trimestre-btn ${tri === actual ? "active" : ""}" onclick="cambiarTrimestre('${tri}')">
        ${etiquetaTrimestre(tri)}
      </button>
    `).join("");
  }

  function irAAsistencias() {
    const ahora = new Date();
    window.location.href = `dia.html?anio=${ahora.getFullYear()}&mes=${ahora.getMonth() + 1}&dia=${ahora.getDate()}`;
  }

  function cerrarSesion() {
    sessionStorage.clear();
    window.location.href = "index.html";
  }

  function leerJSON(clave, inicial = {}) {
    try { return JSON.parse(localStorage.getItem(clave) || JSON.stringify(inicial)); }
    catch (error) { return inicial; }
  }

  function guardarJSON(clave, valor) {
    localStorage.setItem(clave, JSON.stringify(valor));
  }

  function escaparHTML(valor) {
    return String(valor ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function docenteNavItem() {
    if (sessionStorage.getItem("sesionRol") !== "docente") return "";
    const nombre = escaparHTML(sessionStorage.getItem("docenteNombre") || sessionStorage.getItem("docenteUsuario") || "Docente");
    return `<button type="button" class="user-nav" ondblclick="abrirCambioClaveDocente()" title="Doble click para cambiar contrasena"><i class="bi bi-person-badge-fill"></i><span><small>Docente</small>${nombre}</span></button>`;
  }

  function docenteNavbarHTML(activo) {
    const activoAsistencia = activo === "asistencias" ? "active" : "";
    const activoHorario = activo === "horario" ? "active" : "";
    const activoTareas = activo === "tareas" ? "active" : "";
    return `
      <div class="nav-visible">
        <button class="nav-priority ${activoAsistencia}" type="button" onclick="irAAsistencias()"><i class="bi bi-clipboard2-check-fill"></i> ASISTENCIAS</button>
        <a class="nav-priority ${activoTareas}" id="navTareas" href="mes.html"><i class="bi bi-card-checklist"></i> TAREAS</a>
        <button class="nav-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#docenteSidebar" aria-controls="docenteSidebar" aria-label="Abrir menu">
          <i class="bi bi-list"></i>
        </button>
      </div>
      <div class="offcanvas offcanvas-end docente-sidebar" tabindex="-1" id="docenteSidebar" aria-labelledby="docenteSidebarLabel">
        <div class="offcanvas-header">
          <div>
            <div class="sidebar-eyebrow">Menu docente</div>
            <h5 class="offcanvas-title mb-0" id="docenteSidebarLabel">Opciones</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
          <div class="sidebar-actions">
            <a class="${activoHorario}" href="horario.html"><i class="bi bi-calendar3-week-fill"></i> HORARIO</a>
            <a id="navNotas" href="notas.html"><i class="bi bi-journal-check"></i> NOTAS</a>
            ${docenteNavItem()}
            <button class="nav-logout" type="button" onclick="cerrarSesion()" title="Salir"><i class="bi bi-power"></i> SALIR</button>
          </div>
        </div>
      </div>
    `;
  }

  function directorNavbarHTML(activo) {
    const item = (clave, href, icono, titulo) => `<a class="${activo === clave ? "active" : ""}" href="${href}" title="${titulo}" aria-label="${titulo}"><i class="bi ${icono}"></i></a>`;
    return `
      <span class="director-brand"><i class="bi bi-eye-fill"></i> DIRECTOR</span>
      <button class="director-menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#directorSidebar" aria-controls="directorSidebar" aria-label="Abrir menu">
        <i class="bi bi-list"></i>
      </button>
      <div class="offcanvas offcanvas-end director-sidebar" tabindex="-1" id="directorSidebar" aria-labelledby="directorSidebarLabel">
        <div class="offcanvas-header">
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
          <nav class="director-icon-nav" id="directorSidebarLabel">
            ${item("asistencias", "dia.html", "bi-clipboard2-check-fill", "Asistencias")}
            ${item("horario", "horario.html", "bi-calendar3-week-fill", "Horarios")}
            ${item("notas", "notas.html", "bi-journal-check", "Notas")}
            ${item("reportes", "reportes.html", "bi-bar-chart-line-fill", "Reportes")}
            <button class="director-logout" type="button" onclick="cerrarSesion()" title="Salir" aria-label="Salir"><i class="bi bi-power"></i></button>
          </nav>
        </div>
      </div>
    `;
  }

  function abrirCambioClaveDocente() {
    if (!document.getElementById("modalClaveDocente")) {
      document.body.insertAdjacentHTML("beforeend", `
        <div class="modal fade" id="modalClaveDocente" tabindex="-1">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <form onsubmit="guardarCambioClaveDocente(event)">
                <div class="modal-header">
                  <h5 class="modal-title"><i class="bi bi-key-fill"></i> Cambiar contrasena</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                  <label class="form-label fw-bold" for="claveActualDocente">Contrasena actual</label>
                  <input id="claveActualDocente" class="form-control mb-2" type="password" required>
                  <label class="form-label fw-bold" for="claveNuevaDocente">Contrasena nueva</label>
                  <input id="claveNuevaDocente" class="form-control mb-2" type="password" required>
                  <label class="form-label fw-bold" for="claveConfirmarDocente">Confirmar contrasena</label>
                  <input id="claveConfirmarDocente" class="form-control" type="password" required>
                  <div id="mensajeClaveDocente" class="alert alert-danger py-2 mt-3 d-none"></div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                  <button class="btn btn-primary fw-bold" type="submit">Guardar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `);
    }
    document.getElementById("claveActualDocente").value = "";
    document.getElementById("claveNuevaDocente").value = "";
    document.getElementById("claveConfirmarDocente").value = "";
    document.getElementById("mensajeClaveDocente").classList.add("d-none");
    new bootstrap.Modal(document.getElementById("modalClaveDocente")).show();
  }

  function guardarCambioClaveDocente(event) {
    event.preventDefault();
    const actual = document.getElementById("claveActualDocente").value;
    const nueva = document.getElementById("claveNuevaDocente").value;
    const confirmar = document.getElementById("claveConfirmarDocente").value;
    const mensaje = document.getElementById("mensajeClaveDocente");
    const usuario = sessionStorage.getItem("docenteUsuario");
    const docentes = leerJSON("docentes", []);
    const docente = docentes.find(item => item.usuario === usuario);

    function error(texto) {
      mensaje.textContent = texto;
      mensaje.classList.remove("d-none");
    }

    if (!docente) return error("No se encontro la cuenta docente.");
    if (docente.clave !== actual) return error("La contrasena actual no es correcta.");
    if (nueva.length < 4) return error("La contrasena nueva debe tener al menos 4 caracteres.");
    if (nueva !== confirmar) return error("La confirmacion no coincide.");

    docente.clave = nueva;
    guardarJSON("docentes", docentes);
    bootstrap.Modal.getInstance(document.getElementById("modalClaveDocente")).hide();
    alert("Contrasena actualizada correctamente.");
  }

  function renderNavbar() {
    const rol = sessionStorage.getItem("sesionRol");
    const nav = document.getElementById("appNavbar");
    if (rol === "admin") {
      nav.innerHTML = `
        <a href="admin.html"><i class="bi bi-shield-lock-fill"></i> ADMIN</a>
        <a href="horario.html"><i class="bi bi-calendar3-week-fill"></i> HORARIOS</a>
        <a href="notas.html"><i class="bi bi-journal-check"></i> NOTAS</a>
        <button class="active" type="button" onclick="irAAsistencias()"><i class="bi bi-clipboard2-check-fill"></i> ASISTENCIAS</button>
        <span class="nav-spacer"></span>
        <button type="button" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> CERRAR SESION</button>
      `;
      return;
    }
    if (rol === "director") {
      nav.classList.add("director-navbar");
      nav.innerHTML = directorNavbarHTML("asistencias");
      return;
    }
    nav.classList.add("docente-navbar");
    nav.innerHTML = docenteNavbarHTML("asistencias");
  }

  function volverAlMes() {
    window.location.href = `mes.html?anio=${anio}&mes=${mes}`;
  }

  function volverAlInicio() {
    window.location.href = `horario.html`;
  }

  function esVistaSoloLectura() {
    return ["admin", "director"].includes(sessionStorage.getItem("sesionRol"));
  }

  function etiquetaEstado(estado) {
    return {
      blanco: "F",
      verde: "P",
      amarillo: "A",
      morado: "L"
    }[estado] || "F";
  }

  function cuentaComoRegistro(estado) {
    return ["verde", "amarillo", "morado"].includes(estado);
  }

  function claseEstadoTabla(estado, registrado) {
    if (!registrado) return "estado-blanco";
    if (estado === "blanco") return "estado-rojo";
    return {
      verde: "estado-verde",
      amarillo: "estado-amarillo",
      morado: "estado-morado"
    }[estado] || "estado-blanco";
  }

  function normalizarAsignacionesDocente(docente) {
    if (Array.isArray(docente?.asignaciones) && docente.asignaciones.length) {
      return docente.asignaciones.map(asig => ({
        curso: asig.curso,
        materias: Array.isArray(asig.materias) ? asig.materias : []
      })).filter(asig => asig.curso && asig.materias.length);
    }
    const materias = Array.isArray(docente?.materias) && docente.materias.length
      ? docente.materias
      : [docente?.materia].filter(Boolean);
    return docente?.curso && materias.length ? [{ curso: docente.curso, materias }] : [];
  }

  function guardarSesionDocenteDesdeCuenta(docente) {
    const asignaciones = normalizarAsignacionesDocente(docente);
    const cursos = [...new Set(asignaciones.map(asig => asig.curso).filter(Boolean))];
    const materias = asignaciones[0]?.materias || [];
    sessionStorage.setItem("docenteNombre", docente.nombre || sessionStorage.getItem("docenteNombre") || "");
    sessionStorage.setItem("docenteCurso", cursos[0] || "");
    sessionStorage.setItem("docenteCursos", JSON.stringify(cursos));
    sessionStorage.setItem("docenteMateria", materias[0] || "");
    sessionStorage.setItem("docenteMaterias", JSON.stringify(materias));
    sessionStorage.setItem("docenteAsignaciones", JSON.stringify(asignaciones));
    return asignaciones;
  }

  function asignacionesDocente() {
    if (sessionStorage.getItem("sesionRol") !== "docente") return [];
    const usuario = sessionStorage.getItem("docenteUsuario");
    const docente = leerJSON("docentes", []).find(item => item.usuario === usuario);
    if (docente) return guardarSesionDocenteDesdeCuenta(docente);
    try {
      const asignaciones = JSON.parse(sessionStorage.getItem("docenteAsignaciones") || "[]");
      if (Array.isArray(asignaciones) && asignaciones.length) return asignaciones;
    } catch (error) {}
    const curso = sessionStorage.getItem("docenteCurso");
    let materias = [];
    try { materias = JSON.parse(sessionStorage.getItem("docenteMaterias") || "[]"); }
    catch (error) { materias = [sessionStorage.getItem("docenteMateria")].filter(Boolean); }
    return curso ? [{ curso, materias }] : [];
  }

  function cursosDocenteAsignados() {
    return [...new Set(asignacionesDocente().map(asig => asig.curso).filter(Boolean))];
  }

  function cambiarMesResumen(delta) {
    const nueva = new Date(anio, mes - 1 + delta, 1);
    anio = nueva.getFullYear();
    mes = nueva.getMonth() + 1;
    mostrarAsistenciaMensual();
  }

  function seleccionarCursoResumen(curso) {
    cursoVistaActual = curso;
    localStorage.setItem("cursoSeleccionado", curso);
    if (esVistaSoloLectura()) mostrarAsistenciaMensual();
    else mostrarInformacion();
  }

  function cursosOficialesVisibles(alumnosPorCurso) {
    const guardados = JSON.parse(localStorage.getItem("cursos") || "[]");
    const extras = guardados.filter(curso =>
      !CURSOS_DEFAULT.includes(curso) &&
      !CURSOS_ANTERIORES.includes(curso) &&
      (alumnosPorCurso[curso] || []).length
    );
    const cursos = [...new Set([...CURSOS_DEFAULT, ...extras])];
    if (JSON.stringify(guardados) !== JSON.stringify(cursos)) {
      localStorage.setItem("cursos", JSON.stringify(cursos));
    }
    return cursos;
  }

  function mostrarAsistenciaMensual() {
    document.querySelectorAll("#slideContainer > .d-flex.justify-content-between.mb-3").forEach(el => el.style.display = "none");
    const alumnosPorCurso = JSON.parse(localStorage.getItem("alumnos")) || {};
    const asistencias = JSON.parse(localStorage.getItem("asistencias")) || {};
    const coloresCursos = JSON.parse(localStorage.getItem("cursoColores")) || {};
    const colorCurso = curso => coloresCursos[curso] || "#12355b";
    const cursos = cursosOficialesVisibles(alumnosPorCurso);
    if (!cursoVistaActual || !cursos.includes(cursoVistaActual)) cursoVistaActual = cursos[0] || "";

    const fechaMes = new Date(anio, mes - 1, 1);
    document.getElementById("tituloDia").innerText = `Asistencias de ${fechaMes.toLocaleDateString("es-ES", { month:"long", year:"numeric" })}`;
    document.querySelector("#slideContainer h6").textContent = "Resumen mensual por curso";
    const detalleContainer = document.getElementById("detalleCursos");

    if (!cursos.length) {
      detalleContainer.innerHTML = '<div class="alert alert-info text-center">No hay cursos registrados.</div>';
      return;
    }

    const totalDias = new Date(anio, mes, 0).getDate();
    const alumnos = alumnosPorCurso[cursoVistaActual] || [];
    const fechasRegistradas = new Set();
    for (let d = 1; d <= totalDias; d++) {
      const fecha = `${anio}-${String(mes).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      if (alumnos.some(nombre => cuentaComoRegistro(asistencias[`${fecha}|${cursoVistaActual}|${nombre}`] || "blanco"))) {
        fechasRegistradas.add(fecha);
      }
    }

    let html = `
      <div class="course-tabs-bar">
        ${cursos.map(curso => `<button class="course-tab ${curso === cursoVistaActual ? "active" : ""}" title="${curso}" style="${curso === cursoVistaActual ? `border-color:${colorCurso(curso)}; color:${colorCurso(curso)}; background:${colorCursoPastel(colorCurso(curso))};` : `border-color:${colorCurso(curso)};`}" onclick="seleccionarCursoResumen('${String(curso).replaceAll("\\", "\\\\").replaceAll("'", "\\'").replaceAll('"', "&quot;")}')">${etiquetaCursoCorta(curso)}</button>`).join("")}
      </div>
      <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
        <div class="month-switch">
          <button class="btn btn-outline-primary month-arrow" onclick="cambiarMesResumen(-1)" title="Mes anterior" aria-label="Mes anterior"><i class="bi bi-chevron-left"></i></button>
          <div class="month-label">${fechaMes.toLocaleDateString("es-ES", { month:"long", year:"numeric" })}</div>
          <button class="btn btn-outline-primary month-arrow" onclick="cambiarMesResumen(1)" title="Mes siguiente" aria-label="Mes siguiente"><i class="bi bi-chevron-right"></i></button>
        </div>
      </div>
      <div class="attendance-wrap">
        <table class="attendance-table">
          <thead>
            <tr>
              <th class="student-col">Alumno</th>
              ${Array.from({ length: totalDias }, (_, i) => `<th>${i + 1}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
    `;

    alumnos.forEach(nombre => {
      html += `<tr><td class="student-col fw-bold">${nombre}</td>`;
      for (let d = 1; d <= totalDias; d++) {
        const fecha = `${anio}-${String(mes).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const registrado = fechasRegistradas.has(fecha);
        const estado = asistencias[`${fecha}|${cursoVistaActual}|${nombre}`] || "blanco";
        html += `<td class="attendance-cell ${claseEstadoTabla(estado, registrado)}">${registrado ? etiquetaEstado(estado) : ""}</td>`;
      }
      html += "</tr>";
    });

    html += "</tbody></table></div>";
    detalleContainer.innerHTML = html;
  }

  function cambiarDia(delta) {
    let nuevaFecha = new Date(anio, mes - 1, dia + delta);
    while (nuevaFecha.getDay() === 0 || nuevaFecha.getDay() === 6) {
      nuevaFecha.setDate(nuevaFecha.getDate() + (delta > 0 ? 1 : -1));
    }
    anio = nuevaFecha.getFullYear();
    mes = nuevaFecha.getMonth() + 1;
    dia = nuevaFecha.getDate();
    window.location.href = `dia.html?anio=${anio}&mes=${mes}&dia=${dia}`;
  }

  function animarCambio(delta) {
    const cont = document.getElementById("slideContainer");
    cont.classList.add(delta > 0 ? "slide-left" : "slide-right");
    setTimeout(() => cambiarDia(delta), 400);
  }

  function mostrarInformacion(modoEdicion = false) {
    const fecha = new Date(anio, mes - 1, dia);
    document.getElementById("tituloDia").innerText =
      `${diasSemana[fecha.getDay()]}, ${dia} de ${nombreMeses[mes - 1]} de ${anio}`;

    const detalleContainer = document.getElementById("detalleCursos");
    detalleContainer.innerHTML = "";

    const alumnosPorCurso = JSON.parse(localStorage.getItem("alumnos")) || {};
    const asistencias = JSON.parse(localStorage.getItem("asistencias")) || {};
    const coloresCursos = JSON.parse(localStorage.getItem("cursoColores")) || {};
    const colorCurso = curso => coloresCursos[curso] || "#12355b";
    let cursos = Object.keys(alumnosPorCurso);
    if (sessionStorage.getItem("sesionRol") === "docente") {
      const permitidos = cursosDocenteAsignados();
      const filtrados = cursos.filter(curso => permitidos.includes(curso));
      cursos = filtrados.length ? filtrados : permitidos;
    }

    if (cursos.length === 0) {
      detalleContainer.innerHTML = `<p class="text-muted text-center">No hay cursos asignados.</p>`;
      return;
    }

    if (!cursoVistaActual || !cursos.includes(cursoVistaActual)) cursoVistaActual = cursos[0];
    localStorage.setItem("cursoSeleccionado", cursoVistaActual);
    detalleContainer.innerHTML = `
      <div class="course-tabs-bar">
        ${cursos.map(curso => `<button class="course-tab ${curso === cursoVistaActual ? "active" : ""}" title="${curso}" style="${curso === cursoVistaActual ? `border-color:${colorCurso(curso)}; color:${colorCurso(curso)}; background:${colorCursoPastel(colorCurso(curso))};` : `border-color:${colorCurso(curso)};`}" onclick="seleccionarCursoResumen('${String(curso).replaceAll("\\", "\\\\").replaceAll("'", "\\'").replaceAll('"', "&quot;")}')">${etiquetaCursoCorta(curso)}</button>`).join("")}
      </div>
    `;

    [cursoVistaActual].forEach(curso => {
      const div = document.createElement("div");
      div.className = "curso-card";
      div.style.borderTopColor = colorCurso(curso);

      const listaAlumnos = alumnosPorCurso[curso] || [];
      const totales = listaAlumnos.reduce((acc, nombre) => {
        const estado = asistencias[`${claveDeFecha()}|${curso}|${nombre}`] || "blanco";
        acc[estado] = (acc[estado] || 0) + 1;
        return acc;
      }, { blanco: 0, verde: 0, amarillo: 0, morado: 0 });
      const diaRegistrado = listaAlumnos.some(nombre => cuentaComoRegistro(asistencias[`${claveDeFecha()}|${curso}|${nombre}`] || "blanco"));

      div.innerHTML = `
        ${diaRegistrado ? `
          <div class="total-strip">
            <span class="total-chip estado-verde">Presentes: ${totales.verde || 0}</span>
            <span class="total-chip estado-amarillo">Atrasos: ${totales.amarillo || 0}</span>
            <span class="total-chip estado-morado">Permisos: ${totales.morado || 0}</span>
            <span class="total-chip estado-blanco border">Faltas: ${totales.blanco || 0}</span>
          </div>
        ` : '<div class="alert alert-info py-2 mb-2">Dia sin registro de asistencia.</div>'}
      `;

      if (listaAlumnos.length === 0) {
        div.innerHTML += `<p class="text-muted">No hay alumnos registrados en este curso.</p>`;
      } else if (esVistaSoloLectura() && !diaRegistrado) {
        div.innerHTML += "";
      } else {
        listaAlumnos.forEach(nombre => {
          const claveAlumno = `${claveDeFecha()}|${curso}|${nombre}`;
          const estado = asistencias[claveAlumno] || "blanco";

          const estadoColor = {
            blanco: "estado-blanco",
            verde: "estado-verde",
            amarillo: "estado-amarillo",
            morado: "estado-morado"
          }[estado];

          const divAlumno = document.createElement("div");
          divAlumno.className = `asistencia-item ${estadoColor}`;
          divAlumno.innerHTML = `
            <span>${nombre}</span>
            <span class="readonly-badge ${estadoColor}">${etiquetaEstado(estado)}</span>
          `;

          if (!esVistaSoloLectura() && (esHoy || modoEdicion)) {
            divAlumno.onclick = () => {
              const nuevoEstado = obtenerSiguienteEstado(estado);
              asistencias[claveAlumno] = nuevoEstado;
              localStorage.setItem("asistencias", JSON.stringify(asistencias));
              const trimestresAsistencia = JSON.parse(localStorage.getItem("trimestresAsistencia")) || {};
              trimestresAsistencia[claveDeFecha()] = trimestreActual();
              localStorage.setItem("trimestresAsistencia", JSON.stringify(trimestresAsistencia));
              mostrarInformacion(modoEdicion);
            };
          }

          div.appendChild(divAlumno);
        });
      }

      detalleContainer.appendChild(div);
    });

    if (!esVistaSoloLectura() && !esHoy && !modoEdicion) {
      const btnEditar = document.createElement("button");
      btnEditar.className = "btn btn-sm btn-warning mt-3";
      btnEditar.textContent = "Editar asistencia";
      btnEditar.onclick = () => mostrarInformacion(true);
      detalleContainer.appendChild(btnEditar);
    }
  }

  function obtenerSiguienteEstado(estadoActual) {
    switch (estadoActual) {
      case "blanco": return "verde";
      case "verde": return "amarillo";
      case "amarillo": return "morado";
      case "morado": return "blanco";
      default: return "blanco";
    }
  }

  renderNavbar();
  renderTrimestrePanel();
  if (esVistaSoloLectura()) mostrarAsistenciaMensual();
  else mostrarInformacion();
</script>
</body>
</html>
