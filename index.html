<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U.E. Ecologica N. B.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(90deg, rgba(5, 21, 37, .68), rgba(5, 21, 37, .18) 58%, rgba(5, 21, 37, .08)),
        url("images/login-fondo.png") center/cover no-repeat;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 18px;
    }
    .login-card {
      width: min(420px, 100%);
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 12px;
      box-shadow: 0 22px 60px rgba(0,0,0,.30);
      padding: 24px;
    }
    .brand {
      color: #12355b;
      font-weight: 900;
      text-align: center;
      margin-bottom: 6px;
    }
    .school-logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
      display: block;
      margin: 0 auto 14px;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(18, 53, 91, .18);
    }
    .subtitle {
      color: #637083;
      text-align: center;
      font-weight: 700;
      margin-bottom: 22px;
    }
    .form-label { font-weight: 800; color: #213547; }
    .btn-login {
      background: #12355b;
      border: 0;
      font-weight: 900;
      padding: 10px;
    }
    .btn-login:hover { background: #0d6efd; }
    .app-version {
      margin: 16px 0 0;
      text-align: center;
      color: #6b7788;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    .cache-maintenance {
      position: fixed;
      right: 16px;
      top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.96);
      color: #12355b;
      border: 2px solid rgba(18, 53, 91, .35);
      box-shadow: 0 12px 28px rgba(0,0,0,.24);
      text-decoration: none;
      font-size: .86rem;
      font-weight: 900;
      z-index: 9999;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .cache-maintenance:hover,
    .cache-maintenance:focus {
      color: #fff;
      background: #0d6efd;
      border-color: #fff;
      transform: translateY(-2px);
    }
    .cache-maintenance i { font-size: 1.05rem; line-height: 1; }
    @media (max-width: 520px) {
      .cache-maintenance {
        right: 10px;
        top: 10px;
        padding: 7px 10px;
        font-size: .78rem;
      }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-sync.js?v=v1.9"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12355b">
  <meta name="apple-mobile-web-app-title" content="U.E. Ecologica N. B.">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <script defer src="pwa.js?v=v1.9"></script>
</head>
<body>
  <a class="cache-maintenance" href="limpiar-cache.html" title="Limpiar cache de la aplicacion" aria-label="Limpiar cache de la aplicacion">
    <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
    <span>Actualizar app</span>
  </a>

  <main class="login-card">
    <img class="school-logo" src="images/logo-nueva-bolivia.png" alt="Unidad Educativa Ecologica Nueva Bolivia">
    <h1 class="brand">Ingreso al Sistema</h1>
    <p class="subtitle">Sistema de asistencia y notas</p>

    <form id="formLogin">
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario</label>
        <input id="usuario" class="form-control form-control-lg" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input id="clave" class="form-control form-control-lg" type="password" autocomplete="current-password" required>
      </div>
      <div id="mensaje" class="alert alert-danger py-2 d-none">Usuario o contraseña incorrectos.</div>
      <button class="btn btn-primary btn-login w-100" type="submit">Ingresar</button>
    </form>
    <p class="app-version">Versión v1.9</p>
  </main>

  <script>
    function leerJSON(clave, inicial = {}) {
      try { return JSON.parse(localStorage.getItem(clave) || JSON.stringify(inicial)); }
      catch (error) { return inicial; }
    }

    function alumnoRegistro(item, curso) {
      const alumnosCI = leerJSON("alumnosCI", {});
      const estados = leerJSON("alumnosEstado", {});
      const nombre = typeof item === "string" ? item : String(item?.nombre || "").trim();
      if (!nombre) return null;
      const ci = String((item && typeof item === "object" ? item.ci : "") || alumnosCI?.[curso]?.[nombre] || "").trim();
      const activo = item && typeof item === "object" && Object.prototype.hasOwnProperty.call(item, "activo")
        ? item.activo !== false
        : estados?.[curso]?.[nombre] !== false;
      return { nombre, ci, activo };
    }

    function alumnosCursoRegistros(curso) {
      const lista = leerJSON("alumnos", {})[curso] || [];
      return lista.map(item => alumnoRegistro(item, curso)).filter(Boolean);
    }

    function mostrarMensaje(texto) {
      const mensaje = document.getElementById("mensaje");
      mensaje.textContent = texto;
      mensaje.classList.remove("d-none");
    }

    function guardarAccesoAlumnoOffline(ci, curso, nombre) {
      const accesos = leerJSON("alumnosAccesoOffline", {});
      accesos[String(ci)] = { curso, nombre, clave: String(ci) };
      localStorage.setItem("alumnosAccesoOffline", JSON.stringify(accesos));
    }

    function ingresarAlumno(curso, nombre) {
      sessionStorage.setItem("sesionRol", "alumno");
      sessionStorage.setItem("sesionAlumno", "activa");
      sessionStorage.setItem("alumnoCurso", curso);
      sessionStorage.setItem("alumnoNombre", nombre);
      localStorage.setItem("cursoSeleccionado", curso);
      window.location.href = `alumno.html?curso=${encodeURIComponent(curso)}&alumno=${encodeURIComponent(nombre)}`;
    }

    function correoAdminAutorizado(email) {
      const permitidos = Array.isArray(window.ADMIN_AUTH_EMAILS) ? window.ADMIN_AUTH_EMAILS : [];
      return permitidos.map(item => String(item).toLowerCase()).includes(String(email || "").toLowerCase());
    }

    function inicializarFirebaseAuth() {
      if (!window.firebase || !firebase.auth || !window.firebaseConfig?.apiKey) {
        throw new Error("Firebase Authentication no esta configurado.");
      }
      if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
      return firebase.auth();
    }

    async function ingresarAdminConFirebase(usuario, clave) {
      if (!usuario.includes("@")) return false;
      if (!navigator.onLine) {
        mostrarMensaje("Conecte a internet para ingresar como administrador.");
        return true;
      }

      try {
        const auth = inicializarFirebaseAuth();
        const credencial = await auth.signInWithEmailAndPassword(usuario, clave);
        const email = credencial.user?.email || usuario;
        if (!correoAdminAutorizado(email)) {
          await auth.signOut().catch(() => {});
          mostrarMensaje("Este correo no esta autorizado como administrador.");
          return true;
        }

        sessionStorage.setItem("sesionRol", "admin");
        sessionStorage.setItem("sesionDocente", "activa");
        sessionStorage.setItem("adminAuthEmail", email);
        window.location.href = "admin.html";
        return true;
      } catch (error) {
        mostrarMensaje("Correo o contrasena de administrador incorrectos.");
        return true;
      }
    }

    if (sessionStorage.getItem("sesionRol") === "admin") {
      window.location.href = "admin.html";
    } else if (sessionStorage.getItem("sesionRol") === "director") {
      window.location.href = "dia.html";
    } else if (sessionStorage.getItem("sesionDocente") === "activa") {
      window.location.href = "mes.html";
    } else if (sessionStorage.getItem("sesionAlumno") === "activa") {
      const curso = sessionStorage.getItem("alumnoCurso") || "";
      const alumno = sessionStorage.getItem("alumnoNombre") || "";
      window.location.href = `alumno.html?curso=${encodeURIComponent(curso)}&alumno=${encodeURIComponent(alumno)}`;
    }

    function compensarFirebaseDespuesDeLogin() {
      if (typeof window.firebaseAfterLogin !== "function") return;
      window.firebaseAfterLogin().catch(error => console.info("Firebase seguira sincronizando en el modulo:", error.message));
    }

    document.getElementById("formLogin").addEventListener("submit", async event => {
      event.preventDefault();
      const usuario = document.getElementById("usuario").value.trim();
      const clave = document.getElementById("clave").value;

      if (await ingresarAdminConFirebase(usuario, clave)) return;

      const director = leerJSON("director", null);
      if (director && usuario === director.usuario && clave === director.clave) {
        sessionStorage.setItem("sesionRol", "director");
        sessionStorage.setItem("sesionDocente", "activa");
        sessionStorage.setItem("directorNombre", director.nombre);
        window.location.href = "dia.html";
        return;
      }

      const docentes = leerJSON("docentes", []);
      const docenteCuenta = docentes.find(item => item.usuario === usuario && item.clave === clave);
      if (docenteCuenta && docenteCuenta.activo === false) {
        mostrarMensaje("Esta cuenta docente esta deshabilitada. Consulte con administracion.");
        return;
      }
      const docente = docenteCuenta;
      if (docente) {
        const asignaciones = Array.isArray(docente.asignaciones) && docente.asignaciones.length
          ? docente.asignaciones
          : [{
              curso: docente.curso,
              materias: docente.materias && docente.materias.length ? docente.materias : [docente.materia].filter(Boolean)
            }].filter(asig => asig.curso && asig.materias.length);
        const cursosDocente = [...new Set(asignaciones.map(asig => asig.curso))];
        const materiasDocente = asignaciones[0]?.materias || [];
        sessionStorage.setItem("sesionRol", "docente");
        sessionStorage.setItem("sesionDocente", "activa");
        sessionStorage.setItem("docenteUsuario", docente.usuario);
        sessionStorage.setItem("docenteNombre", docente.nombre);
        sessionStorage.setItem("docenteCurso", cursosDocente[0] || "");
        sessionStorage.setItem("docenteCursos", JSON.stringify(cursosDocente));
        sessionStorage.setItem("docenteMateria", materiasDocente[0] || "");
        sessionStorage.setItem("docenteMaterias", JSON.stringify(materiasDocente));
        sessionStorage.setItem("docenteAsignaciones", JSON.stringify(asignaciones));
        localStorage.setItem("cursoSeleccionado", cursosDocente[0] || "");
        compensarFirebaseDespuesDeLogin();
        window.location.href = "mes.html";
        return;
      }

      const alumnos = leerJSON("alumnos", {});
      for (const curso of Object.keys(alumnos)) {
        const encontrado = alumnosCursoRegistros(curso).find(alumno => {
          if (!alumno.activo) return false;
          const ci = String(alumno.ci || "");
          return (ci && usuario === ci && clave === ci) || (usuario === clave && usuario === alumno.nombre);
        });
        if (encontrado) {
          const acceso = encontrado.ci || usuario;
          guardarAccesoAlumnoOffline(acceso, curso, encontrado.nombre);
          ingresarAlumno(curso, encontrado.nombre);
          return;
        }
      }

      const accesosOffline = leerJSON("alumnosAccesoOffline", {});
      const acceso = accesosOffline[usuario];
      if (acceso && clave === acceso.clave) {
        ingresarAlumno(acceso.curso, acceso.nombre);
        return;
      }

      if (!navigator.onLine) {
        mostrarMensaje("Sin internet. Este alumno debe ingresar una vez con internet en este dispositivo.");
        return;
      }

      mostrarMensaje("Usuario o contrasena incorrectos.");
    });
  </script>
</body>
</html>
