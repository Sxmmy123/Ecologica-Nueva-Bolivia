<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario de Actividades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: #eef5f9;
      color: #213547;
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 86px 18px 18px;
    }

    .topbar,
    .calendar-shell {
      background: #fff;
      border: 1px solid #dbe7ef;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(30, 60, 90, .08);
    }

    .topbar {
      padding: 14px;
      margin-bottom: 14px;
    }

    .app-navbar {
      background: #12355b;
      border-radius: 0;
      box-shadow: 0 6px 16px rgba(0,0,0,.14);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      left: 0;
      margin: 0;
      min-height: 58px;
      padding: 10px 24px;
      position: fixed;
      right: 0;
      top: 0;
      width: 100%;
      z-index: 1050;
    }

    .app-navbar a,
    .app-navbar button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      min-height: 38px;
      padding: 8px 14px;
      text-decoration: none;
    }

    .app-navbar .active {
      background: #fff;
      color: #12355b;
    }
    .nav-spacer { flex: 1 1 auto; }
    .user-nav { background:rgba(255,255,255,.18)!important; border-color:rgba(255,255,255,.38)!important; cursor:pointer; }
    .user-nav small { display:block; font-size:10px; font-weight:700; line-height:1; opacity:.85; }
    .docente-navbar { justify-content:flex-start; align-items:center; }
    .docente-navbar .nav-visible { display:flex; flex:1 1 auto; flex-wrap:wrap; gap:8px; align-items:center; }
    .docente-navbar .nav-menu { flex-basis:100%; gap:8px; padding-top:8px; }
    .docente-navbar .nav-menu.show,
    .docente-navbar .nav-menu.collapsing { display:flex!important; flex-wrap:wrap; }
    .nav-priority { font-size:15px; padding-inline:18px!important; }
    .module-title { align-items:center; color:#fff; display:inline-flex; font-size:17px; font-weight:900; gap:9px; letter-spacing:.2px; min-height:40px; }
    .module-title i { font-size:22px; }
    .nav-toggler { margin-left:auto; background:#fff!important; color:#12355b!important; border-color:#fff!important; min-width:46px; justify-content:center; }
    .nav-logout { background:#dc3545!important; border-color:#ffb3bd!important; color:#fff!important; }
    .nav-logout:hover { background:#bb2d3b!important; }
    .docente-sidebar { color:#213547; }
    .docente-sidebar .offcanvas-header { background:#12355b; color:#fff; }
    .docente-sidebar .btn-close { filter:invert(1) grayscale(1); opacity:.9; }
    .sidebar-eyebrow { font-size:11px; font-weight:900; opacity:.75; text-transform:uppercase; }
    .docente-sidebar .offcanvas-body { display:flex; flex-direction:column; }
    .sidebar-actions { display:flex; flex:1; flex-direction:column; gap:10px; min-height:100%; }
    .sidebar-actions a,
    .sidebar-actions button { align-items:center; background:#f8fafc!important; border:1px solid #dbe7ef!important; border-radius:8px; color:#12355b!important; display:flex; font-weight:900; gap:10px; justify-content:flex-start; min-height:48px; padding:10px 14px; text-decoration:none; width:100%; }
    .sidebar-actions a.active,
    .sidebar-actions button.active { background:#12355b!important; border-color:#12355b!important; color:#fff!important; }
    .sidebar-actions .user-nav { background:#eef5ff!important; border-color:#bfd4ea!important; }
    .sidebar-actions .nav-logout { background:#dc3545!important; border-color:#dc3545!important; color:#fff!important; margin-top:auto; }
    .sidebar-actions .nav-logout:hover { background:#bb2d3b!important; }

    .trimestre-panel {
      background: #fff;
      border: 1px solid #dbe7ef;
      border-left: 8px solid #12355b;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(30, 60, 90, .08);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 12px 14px;
    }

    .trimestre-panel .label {
      color: #12355b;
      font-weight: 900;
    }

    .trimestre-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      min-width: 260px;
      overflow: hidden;
    }

    .trimestre-options {
      display: flex;
      gap: 8px;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateX(24px);
      transition: max-width .28s ease, opacity .2s ease, transform .28s ease;
      white-space: nowrap;
    }

    .trimestre-picker.open .trimestre-options {
      max-width: 520px;
      opacity: 1;
      transform: translateX(0);
    }

    .trimestre-btn {
      background: #eef5ff;
      border: 2px solid #cfe2ff;
      border-radius: 8px;
      color: #12355b;
      font-weight: 900;
      padding: 8px 14px;
    }

    .trimestre-current {
      background: #12355b;
      border: 2px solid #12355b;
      border-radius: 8px;
      color: #fff;
      font-weight: 900;
      min-width: 150px;
      padding: 8px 14px;
    }

    .trimestre-btn.active {
      background: #12355b;
      border-color: #12355b;
      color: #fff;
      transform: scale(1.04);
    }

    .course-btn {
      border: 2px solid rgba(18, 53, 91, .18);
      border-bottom: 0;
      border-radius: 9px 9px 0 0;
      color: #12355b;
      font-size: 14px;
      font-weight: 800;
      min-height: 38px;
      padding: 8px 12px;
      transform-origin: center bottom;
      transition: background-color .7s ease, box-shadow .7s ease;
    }

    .course-btn:hover,
    .course-btn.active {
      box-shadow: 0 8px 16px rgba(0, 0, 0, .16);
    }

    .course-btn.active {
      animation: courseTabRise .42s cubic-bezier(.22, .61, .36, 1) both;
      border: 3px solid #12355b;
      border-bottom: 0;
      box-shadow: 0 -9px 18px rgba(18, 53, 91, .14);
      transform: translateY(-7px) scaleY(1.16);
    }

    @keyframes courseTabRise {
      0% { box-shadow: 0 -2px 8px rgba(18, 53, 91, .05); transform: translateY(0) scaleY(1); }
      45% { box-shadow: 0 -5px 13px rgba(18, 53, 91, .09); transform: translateY(-3.9px) scaleY(1.09); }
      100% { box-shadow: 0 -9px 18px rgba(18, 53, 91, .14); transform: translateY(-7px) scaleY(1.16); }
    }

    .trimestre-banner { display:none; }

    .calendar-shell {
      border-top: 12px solid #0d6efd;
      padding: 14px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .legend-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 4px;
    }

    .week-labels,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .week-labels {
      color: #52677a;
      font-weight: 800;
      margin-bottom: 8px;
      text-align: center;
    }

    .calendar-day {
      min-height: 112px;
      border: 1px solid #dbe4ed;
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      cursor: pointer;
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }

    .calendar-day:hover {
      border-color: #0d6efd;
      box-shadow: 0 6px 14px rgba(13, 110, 253, .12);
      transform: translateY(-1px);
    }

    .calendar-day.today {
      border: 2px solid #dc3545;
    }

    .day-number {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .activity-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      border-radius: 6px;
      color: #fff;
      font-size: 11px;
      line-height: 1.2;
      margin-top: 4px;
      padding: 4px 6px;
    }

    .activity-pill.hacer { background: #198754; }
    .activity-pill.saber { background: #0d6efd; }

    .activity-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-day {
      min-height: 112px;
    }

    .step-card {
      border: 1px solid #dbe7ef;
      border-radius: 10px;
      background: #fff;
      padding: 12px;
      margin-bottom: 12px;
    }

    .type-card {
      border: 2px solid #dbe4ed;
      border-radius: 10px;
      cursor: pointer;
      height: 100%;
      padding: 18px;
      text-align: center;
      transition: .15s;
    }

    .type-card:hover {
      border-color: #0d6efd;
      background: #f4f9ff;
    }

    .type-card.active {
      border-color: #198754;
      background: #e8f5e9;
    }

    .date-grid,
    .date-labels {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .date-labels {
      color: #52677a;
      font-weight: 800;
      text-align: center;
    }

    .date-week {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .date-box {
      aspect-ratio: 1 / 1;
      align-items: center;
      border: 1px solid #dbe4ed;
      border-radius: 8px;
      background: #f8fafc;
      color: #7a8794;
      display: flex;
      font-weight: 800;
      justify-content: center;
    }

    .date-box.enabled {
      background: #fff;
      border: 2px solid #0d6efd;
      color: #0d6efd;
      cursor: pointer;
    }

    .date-box.enabled:hover {
      background: #eef5ff;
    }

    .date-box.selected {
      background: #198754;
      border-color: #198754;
      color: #fff;
    }

    .date-box.today {
      outline: 2px dashed rgba(220, 53, 69, .35);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 720px) {
      body { padding: 78px 10px 10px; }
      .calendar-day { min-height: 92px; padding: 6px; }
      .activity-pill { font-size: 10px; }
      .calendar-header { align-items: stretch; flex-direction: column; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

</head>
<body>
  <script>
    if (sessionStorage.getItem("sesionDocente") !== "activa") {
      window.location.href = "index.html";
    }
  </script>
  <main class="container-fluid">
    <nav class="app-navbar docente-navbar">

    <section class="topbar">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const ACTIVIDADES_KEY = "actividades";
    const DIAS = ["lunes", "martes", "miercoles", "jueves", "viernes"];
    const TRIMESTRES = ["1er Trimestre", "2do Trimestre", "3er Trimestre"];
    const CURSO_PALETA = ["#12355b", "#198754", "#6f42c1", "#d63384", "#fd7e14", "#0f766e", "#b02a37", "#3d6f9f"];

    function normalizarAsignacionesDocente(docente) {
      if (Array.isArray(docente?.asignaciones) && docente.asignaciones.length) {
        return docente.asignaciones.map(asig => ({
          curso: asig.curso,
          materias: Array.isArray(asig.materias) ? asig.materias : []
        })).filter(asig => asig.curso && asig.materias.length);
      }
      const materias = Array.isArray(docente?.materias) && docente.materias.length
        ? docente.materias
        : [docente?.materia].filter(Boolean);
      return docente?.curso && materias.length ? [{ curso: docente.curso, materias }] : [];
    }

    function guardarSesionDocenteDesdeCuenta(docente) {
      const asignaciones = normalizarAsignacionesDocente(docente);
      const cursos = [...new Set(asignaciones.map(asig => asig.curso).filter(Boolean))];
      const materias = asignaciones[0]?.materias || [];
      sessionStorage.setItem("docenteNombre", docente.nombre || sessionStorage.getItem("docenteNombre") || "");
      sessionStorage.setItem("docenteCurso", cursos[0] || "");
      sessionStorage.setItem("docenteCursos", JSON.stringify(cursos));
      sessionStorage.setItem("docenteMateria", materias[0] || "");
      sessionStorage.setItem("docenteMaterias", JSON.stringify(materias));
      sessionStorage.setItem("docenteAsignaciones", JSON.stringify(asignaciones));
      return asignaciones;
    }

    function asignacionesDocente() {
      if (sessionStorage.getItem("sesionRol") !== "docente") return [];
      const usuario = sessionStorage.getItem("docenteUsuario");
      const docente = leerJSON("docentes", []).find(item => item.usuario === usuario);
      if (docente) return guardarSesionDocenteDesdeCuenta(docente);
      try {
        const asignaciones = JSON.parse(sessionStorage.getItem("docenteAsignaciones") || "[]");
        if (Array.isArray(asignaciones) && asignaciones.length) return asignaciones;
      } catch (error) {}
      const curso = sessionStorage.getItem("docenteCurso");
      let materias = [];
      try { materias = JSON.parse(sessionStorage.getItem("docenteMaterias") || "[]"); }
      catch (error) { materias = [sessionStorage.getItem("docenteMateria")].filter(Boolean); }
      return curso ? [{ curso, materias }] : [];
    }

    function cursosDocenteAsignados() {
      return [...new Set(asignacionesDocente().map(asig => asig.curso).filter(Boolean))];
    }

    function materiasDocenteAsignadas(curso = cursoActual) {
      if (sessionStorage.getItem("sesionRol") !== "docente") return [];
      return [...new Set(asignacionesDocente()
        .filter(asig => asig.curso === curso)
        .flatMap(asig => Array.isArray(asig.materias) ? asig.materias : []))];
    }

    let cursos = leerJSON("cursos", []);
    if (sessionStorage.getItem("sesionRol") === "docente") {
      const permitidos = cursosDocenteAsignados();
      const filtrados = cursos.filter(curso => permitidos.includes(curso));
      cursos = filtrados.length ? filtrados : permitidos;
    }
    const cursoColores = leerJSON("cursoColores", {});

    const cursoParametro = new URLSearchParams(window.location.search).get("curso");
    const cursoGuardado = cursoParametro || localStorage.getItem("cursoSeleccionado");
    let cursoActual = cursos.includes(cursoGuardado) ? cursoGuardado : "";
    let fechaCalendario = new Date();
    let tipoActividad = "";
    let trimestrePanelAbierto = false;

    const cursoSelector = document.getElementById("cursoSelector");
    const trimestreBanner = document.getElementById("trimestreBanner");
    const calendarShell = document.getElementById("calendarShell");
    const diasCalendario = document.getElementById("diasCalendario");
    const tituloMes = document.getElementById("tituloMes");
    const prevMes = document.getElementById("prevMes");
    const nextMes = document.getElementById("nextMes");
    const materiaSelect = document.getElementById("materiaSelect");
    const sinMaterias = document.getElementById("sinMaterias");
    const fechasContainer = document.getElementById("fechasContainer");
    const tituloActividad = document.getElementById("tituloActividad");
    const notaMaxima = document.getElementById("notaMaxima");
    const btnGuardar = document.getElementById("btnGuardar");
    const tipoActividadContainer = document.getElementById("tipoActividadContainer");
    const calendarioContainer = document.getElementById("calendarioContainer");
    const datosActividadContainer = document.getElementById("datosActividadContainer");
    const cardTarea = document.getElementById("cardTarea");
    const cardExamen = document.getElementById("cardExamen");

    function leerJSON(clave, inicial = {}) {
      try {
        return JSON.parse(localStorage.getItem(clave) || JSON.stringify(inicial));
      } catch (error) {
        return inicial;
      }
    }

    function guardarJSON(clave, valor) {
      localStorage.setItem(clave, JSON.stringify(valor));
      if (window.firebaseMarkPackage) window.firebaseMarkPackage(clave);
    }

    function escapar(valor) {
      return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escaparAtributo(valor) {
      return String(valor).replaceAll("\\", "\\\\").replaceAll("'", "\\'").replaceAll('"', "&quot;");
    }

    function trimestreActual() {
      return localStorage.getItem("trimestreActual") || "1er Trimestre";
    }

    function etiquetaTrimestre(valor) {
      return { "1er Trimestre": "1er trimestre", "2do Trimestre": "2do trimestre", "3er Trimestre": "3er trimestre" }[valor] || valor;
    }

    function cambiarTrimestre(valor) {
      if (valor === trimestreActual()) {
        trimestrePanelAbierto = false;
        bootstrap.Modal.getInstance(document.getElementById("modalTrimestre"))?.hide();
        renderTrimestrePanel();
        return;
      }
      if (!confirm(`Esta seguro que desea cambiar a ${valor}? Las actividades nuevas se guardaran en ese trimestre.`)) return;
      localStorage.setItem("trimestreActual", valor);
      trimestrePanelAbierto = false;
      bootstrap.Modal.getInstance(document.getElementById("modalTrimestre"))?.hide();
      renderTrimestrePanel();
      renderModalTrimestre();
      renderCalendario();
    }

    function renderTrimestrePanel() {
      const actual = trimestreActual();
      document.getElementById("trimestrePanel").innerHTML = `
        <div>
          <div class="label"><i class="bi bi-bookmark-check-fill"></i> Trimestre activo</div>
          <div class="small text-muted fw-bold">Las actividades nuevas se guardaran en ${etiquetaTrimestre(actual)}.</div>
        </div>
        <button class="trimestre-current" type="button" data-bs-toggle="modal" data-bs-target="#modalTrimestre">
          <i class="bi bi-pencil-square"></i> ${etiquetaTrimestre(actual)}
        </button>
      `;
      renderModalTrimestre();
    }

    function renderModalTrimestre() {
      const actual = trimestreActual();
      const contenedor = document.getElementById("opcionesTrimestre");
      if (!contenedor) return;
      contenedor.innerHTML = TRIMESTRES.map(tri => `
        <button type="button" class="trimestre-btn ${tri === actual ? "active" : ""}" onclick="cambiarTrimestre('${tri}')">
          ${etiquetaTrimestre(tri)}
        </button>
      `).join("");
    }

    function irAAsistencias() {
      if (sessionStorage.getItem("sesionRol") === "docente" && !window.requireInternetForFirebase("Conecte a internet para ingresar a asistencia.")) return;
      const hoy = new Date();
      window.location.href = `dia.html?anio=${hoy.getFullYear()}&mes=${hoy.getMonth() + 1}&dia=${hoy.getDate()}`;
    }

    function cerrarSesion() {
      if (window.cerrarSesionFirebase) return window.cerrarSesionFirebase();
      sessionStorage.clear();
      window.location.href = "index.html";
    }

    function docenteNavItem() {
      if (sessionStorage.getItem("sesionRol") !== "docente") return "";
      const nombre = escapar(sessionStorage.getItem("docenteNombre") || sessionStorage.getItem("docenteUsuario") || "Docente");
      return `<button type="button" class="user-nav" ondblclick="abrirCambioClaveDocente()" title="Doble click para cambiar contrasena"><i class="bi bi-person-badge-fill"></i><span><small>Docente</small>${nombre}</span></button>`;
    }

    function renderDocenteNavbar() {
      const slot = document.getElementById("docenteNavSlot");
      if (slot) slot.innerHTML = docenteNavItem();
    }

    function abrirCambioClaveDocente() {
      if (!document.getElementById("modalClaveDocente")) {
        document.body.insertAdjacentHTML("beforeend", `
          <div class="modal fade" id="modalClaveDocente" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <form onsubmit="guardarCambioClaveDocente(event)">
                  <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-key-fill"></i> Cambiar contrasena</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                  </div>
                  <div class="modal-body">
                    <label class="form-label fw-bold" for="claveActualDocente">Contrasena actual</label>
                    <input id="claveActualDocente" class="form-control mb-2" type="password" required>
                    <label class="form-label fw-bold" for="claveNuevaDocente">Contrasena nueva</label>
                    <input id="claveNuevaDocente" class="form-control mb-2" type="password" required>
                    <label class="form-label fw-bold" for="claveConfirmarDocente">Confirmar contrasena</label>
                    <input id="claveConfirmarDocente" class="form-control" type="password" required>
                    <div id="mensajeClaveDocente" class="alert alert-danger py-2 mt-3 d-none"></div>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary fw-bold" type="submit">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        `);
      }
      document.getElementById("claveActualDocente").value = "";
      document.getElementById("claveNuevaDocente").value = "";
      document.getElementById("claveConfirmarDocente").value = "";
      document.getElementById("mensajeClaveDocente").classList.add("d-none");
      new bootstrap.Modal(document.getElementById("modalClaveDocente")).show();
    }

    async function guardarCambioClaveDocente(event) {
      event.preventDefault();
      if (!window.requireInternetForFirebase("Conecte a internet para cambiar su contrasena.")) return;
      const actual = document.getElementById("claveActualDocente").value;
      const nueva = document.getElementById("claveNuevaDocente").value;
      const confirmar = document.getElementById("claveConfirmarDocente").value;
      const mensaje = document.getElementById("mensajeClaveDocente");
      const usuario = sessionStorage.getItem("docenteUsuario");
      const docentes = leerJSON("docentes", []);
      const docente = docentes.find(item => item.usuario === usuario);

      function error(texto) {
        mensaje.textContent = texto;
        mensaje.classList.remove("d-none");
      }

      if (!docente) return error("No se encontro la cuenta docente.");
      if (docente.clave !== actual) return error("La contrasena actual no es correcta.");
      if (nueva.length < 4) return error("La contrasena nueva debe tener al menos 4 caracteres.");
      if (nueva !== confirmar) return error("La confirmacion no coincide.");

      docente.clave = nueva;
      guardarJSON("docentes", docentes);
      const guardado = window.firebaseMarkPackage ? await window.firebaseMarkPackage("docentes") : true;
      if (guardado === false) return error("No se pudo guardar en Firebase. Revise la conexion.");
      bootstrap.Modal.getInstance(document.getElementById("modalClaveDocente")).hide();
      alert("Contrasena actualizada correctamente.");
    }

    function actualizarNavegacionCurso() {
      const cursoQS = cursoActual ? `?curso=${encodeURIComponent(cursoActual)}` : "";
      document.getElementById("navTareas").href = `mes.html${cursoQS}`;
      document.getElementById("navNotas").href = `notas.html${cursoQS}`;
    }

    function formatISO(fecha) {
      return `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, "0")}-${String(fecha.getDate()).padStart(2, "0")}`;
    }

    function colorCurso(nombre) {
      const index = Math.max(0, cursos.indexOf(nombre));
      return cursoColores[nombre] || CURSO_PALETA[index % CURSO_PALETA.length];
    }

    function colorCursoPastel(color) {
      const limpio = String(color || "").replace("#", "");
      if (!/^[0-9a-f]{6}$/i.test(limpio)) return "#eef7ff";
      const r = parseInt(limpio.slice(0, 2), 16);
      const g = parseInt(limpio.slice(2, 4), 16);
      const b = parseInt(limpio.slice(4, 6), 16);
      return `rgb(${Math.round(r + (255 - r) * .84)}, ${Math.round(g + (255 - g) * .84)}, ${Math.round(b + (255 - b) * .84)})`;
    }

    function actividadesTodas() {
      return leerJSON(ACTIVIDADES_KEY, []);
    }

    function actividadDelTrimestre(actividad) {
      return !actividad.trimestre || actividad.trimestre === trimestreActual();
    }

    function actividadesDelDia(fechaISO) {
      return actividadesTodas().filter(actividad =>
        actividad.curso === cursoActual &&
        actividad.fecha === fechaISO &&
        actividadDelTrimestre(actividad) &&
        (sessionStorage.getItem("sesionRol") !== "docente" || materiasDocenteAsignadas(actividad.curso).includes(actividad.materia))
      );
    }

    function actividadesDelDiaConIndice(fechaISO) {
      return actividadesTodas()
        .map((actividad, index) => ({ actividad, index }))
        .filter(item =>
          item.actividad.curso === cursoActual &&
          item.actividad.fecha === fechaISO &&
          actividadDelTrimestre(item.actividad) &&
          (sessionStorage.getItem("sesionRol") !== "docente" || materiasDocenteAsignadas(item.actividad.curso).includes(item.actividad.materia))
        );
    }

    function renderCursos() {
      cursoSelector.innerHTML = "";

      if (!cursos.length) {
        cursoSelector.innerHTML = '<div class="alert alert-info mb-0">No existen cursos registrados.</div>';
        diasCalendario.innerHTML = "";
        return;
      }

      if (!cursoActual || !cursos.includes(cursoActual)) cursoActual = cursos[0];
      localStorage.setItem("cursoSeleccionado", cursoActual);
      calendarShell.style.borderTopColor = colorCurso(cursoActual);
      actualizarNavegacionCurso();

      cursos.forEach(curso => {
        const boton = document.createElement("button");
        boton.className = `course-btn ${curso === cursoActual ? "active" : ""}`;
        boton.style.borderColor = colorCurso(curso);
        boton.style.color = colorCurso(curso);
        boton.style.background = curso === cursoActual ? colorCursoPastel(colorCurso(curso)) : "#f8fafc";
        boton.textContent = curso;
        boton.addEventListener("click", () => seleccionarCurso(curso));
        cursoSelector.appendChild(boton);
      });
      renderCalendario();
    }

    function seleccionarCurso(curso) {
      cursoActual = curso;
      localStorage.setItem("cursoSeleccionado", curso);
      const color = colorCurso(curso);
      calendarShell.style.borderTopColor = color;
      actualizarNavegacionCurso();
      renderCursos();
    }

    function renderCalendario() {
      diasCalendario.innerHTML = "";

      if (!cursoActual) return;

      const anio = fechaCalendario.getFullYear();
      const mes = fechaCalendario.getMonth();
      const primero = new Date(anio, mes, 1);
      const inicio = primero.getDay() === 0 ? 6 : primero.getDay() - 1;
      const totalDias = new Date(anio, mes + 1, 0).getDate();
      const hoy = new Date();

      tituloMes.textContent = fechaCalendario.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
      trimestreBanner.textContent = `Trimestre: ${trimestreActual()}`;
      renderTrimestrePanel();

      for (let i = 0; i < inicio && i < 5; i++) {
        const vacio = document.createElement("div");
        vacio.className = "empty-day";
        diasCalendario.appendChild(vacio);
      }

      for (let dia = 1; dia <= totalDias; dia++) {
        const fecha = new Date(anio, mes, dia);
        if (fecha.getDay() === 0 || fecha.getDay() === 6) continue;

        const fechaISO = formatISO(fecha);
        const actividades = actividadesDelDia(fechaISO);
        const caja = document.createElement("div");
        caja.tabIndex = 0;
        caja.setAttribute("role", "button");
        caja.className = `calendar-day text-start ${fecha.toDateString() === hoy.toDateString() ? "today" : ""}`;
        caja.innerHTML = `
          <div class="day-number">${dia}</div>
          ${actividades.map(actividad => `
            <span class="activity-pill ${actividad.categoria === "Hacer" ? "hacer" : "saber"}" title="${escapar(actividad.titulo)}">
              <span class="activity-title">${escapar(actividad.titulo)}</span>
            </span>
          `).join("")}
        `;
        caja.addEventListener("click", () => abrirCalificar(fechaISO));
        caja.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            abrirCalificar(fechaISO);
          }
        });
        diasCalendario.appendChild(caja);
      }
    }

    function abrirCalificar(fechaISO) {
      if (sessionStorage.getItem("sesionRol") === "docente" && !window.requireInternetForFirebase("Conecte a internet para calificar actividades.")) return;
      guardarJSON("actividadesDiaSeleccionado", {
        curso: cursoActual,
        fecha: fechaISO,
        trimestre: trimestreActual(),
        actividades: actividadesDelDia(fechaISO)
      });
      window.location.href = "calificar.html";
    }

    function reiniciarModal() {
      materiaSelect.innerHTML = "";
      fechasContainer.innerHTML = "";
      tituloActividad.value = "";
      notaMaxima.value = "";
      tipoActividad = "";
      cardTarea.classList.remove("active");
      cardExamen.classList.remove("active");
      tipoActividadContainer.classList.add("hidden");
      calendarioContainer.classList.add("hidden");
      datosActividadContainer.classList.add("hidden");
      sinMaterias.classList.add("hidden");
    }

    function cargarMateriasModal() {
      reiniciarModal();

      if (!cursoActual) {
        alert("Seleccione un curso.");
        return;
      }

      let materias = leerJSON(`materias_${cursoActual}`, []);
      if (sessionStorage.getItem("sesionRol") === "docente") {
        const asignadas = materiasDocenteAsignadas(cursoActual);
        materias = materias.filter(materia => asignadas.includes(materia));
      }
      materias.forEach(materia => {
        const option = document.createElement("option");
        option.value = materia;
        option.textContent = materia;
        materiaSelect.appendChild(option);
      });

      if (!materias.length) {
        sinMaterias.classList.remove("hidden");
        return;
      }

      tipoActividadContainer.classList.remove("hidden");
    }

    function seleccionarTipo(tipo) {
      tipoActividad = tipo;
      cardTarea.classList.toggle("active", tipo === "Tarea");
      cardExamen.classList.toggle("active", tipo === "Examen");
      calendarioContainer.classList.remove("hidden");
      datosActividadContainer.classList.remove("hidden");
      generarFechas();
    }

    function generarFechas() {
      fechasContainer.innerHTML = "";
      const materia = materiaSelect.value;
      if (!materia) return;

      const horario = leerJSON(`horario_${cursoActual}`, []);
      const hoy = new Date();
      const offset = (hoy.getDay() + 6) % 7;
      const lunes = new Date(hoy);
      lunes.setDate(hoy.getDate() - offset);

      for (let semana = 0; semana < 3; semana++) {
        const fila = document.createElement("div");
        fila.className = "date-week";

        for (let i = 0; i < 5; i++) {
          const fecha = new Date(lunes);
          fecha.setDate(lunes.getDate() + semana * 7 + i);

          const fechaISO = formatISO(fecha);
          const caja = document.createElement("div");
          caja.className = "date-box";
          caja.dataset.fecha = fechaISO;
          caja.textContent = fecha.toDateString() === hoy.toDateString() ? "Hoy" : fecha.getDate();

          const habilitado = horario.some(filaHorario => filaHorario[DIAS[i]] === materia);
          if (habilitado) {
            caja.classList.add("enabled");
            caja.addEventListener("click", () => seleccionarFecha(caja));
          }

          if (fecha.toDateString() === hoy.toDateString()) caja.classList.add("today");
          fila.appendChild(caja);
        }

        fechasContainer.appendChild(fila);
      }
    }

    function seleccionarFecha(caja) {
      document.querySelectorAll("#fechasContainer .date-box").forEach(item => item.classList.remove("selected"));
      caja.classList.add("selected");
    }

    function guardarActividad() {
      if (sessionStorage.getItem("sesionRol") === "docente" && !window.requireInternetForFirebase("Conecte a internet para agendar actividades.")) return;
      const materia = materiaSelect.value;
      const fecha = document.querySelector("#fechasContainer .selected")?.dataset.fecha;
      const titulo = tituloActividad.value.trim();
      const nota = Number(notaMaxima.value);

      if (!materia || !tipoActividad || !fecha || !titulo || !nota) {
        alert("Complete todos los datos.");
        return;
      }

      const categoria = tipoActividad === "Tarea" ? "Hacer" : "Saber";
      const actividades = actividadesTodas();

      actividades.push({
        curso: cursoActual,
        materia,
        tipo: tipoActividad,
        categoria,
        fecha,
        titulo,
        notaMaxima: nota,
        trimestre: trimestreActual()
      });

      guardarJSON(ACTIVIDADES_KEY, actividades);
      bootstrap.Modal.getInstance(document.getElementById("modalActividad")).hide();
      renderCalendario();
    }

    prevMes.addEventListener("click", () => {
      fechaCalendario.setMonth(fechaCalendario.getMonth() - 1);
      renderCalendario();
    });

    nextMes.addEventListener("click", () => {
      fechaCalendario.setMonth(fechaCalendario.getMonth() + 1);
      renderCalendario();
    });

    materiaSelect.addEventListener("change", () => {
      tipoActividad = "";
      cardTarea.classList.remove("active");
      cardExamen.classList.remove("active");
      calendarioContainer.classList.add("hidden");
      datosActividadContainer.classList.add("hidden");
    });
    cardTarea.addEventListener("click", () => seleccionarTipo("Tarea"));
    cardExamen.addEventListener("click", () => seleccionarTipo("Examen"));
    document.getElementById("btnAbrirActividad").addEventListener("click", () => {
      if (sessionStorage.getItem("sesionRol") === "docente" && !window.requireInternetForFirebase("Conecte a internet para agendar actividades.")) return;
      new bootstrap.Modal(document.getElementById("modalActividad")).show();
    });
    btnGuardar.addEventListener("click", guardarActividad);
    document.getElementById("modalActividad").addEventListener("show.bs.modal", event => {
      if (sessionStorage.getItem("sesionRol") === "docente" && !window.requireInternetForFirebase("Conecte a internet para agendar actividades.")) {
        event.preventDefault();
        return;
      }
      cargarMateriasModal();
    });

    renderDocenteNavbar();
    renderCursos();
  </script>
</body>
</html>
