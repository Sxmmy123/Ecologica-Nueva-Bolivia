      catch (error) { return inicial; }
    }


    function nombreAlumno(item) {
      return typeof item === "string" ? item : String(item?.nombre || "").trim();
    }

    function alumnoActivo(item) {
      return typeof item === "string" ? true : item?.activo !== false;
    }

    function nombresAlumnosCurso(curso, soloActivos = true) {
      const lista = leerJSON("alumnos", {})[curso] || [];
      return lista
        .filter(item => !soloActivos || alumnoActivo(item))
        .map(nombreAlumno)
        .filter(Boolean);
    }

    function guardarJSON(clave, valor) {
      localStorage.setItem(clave, JSON.stringify(valor));
      if (window.firebaseMarkPackage) window.firebaseMarkPackage(clave);
    }

    function escapar(valor) {
      return String(valor)
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function escaparAtributo(valor) { return String(valor).replaceAll("\\","\\\\").replaceAll("'","\\'").replaceAll('"',"&quot;"); }

    function urlAlumno(alumno) {
      const params = new URLSearchParams({
        curso: cursoActual,
        alumno,
        trimestre: vistaActual
      });
      return `alumno.html?${params.toString()}`;
    }

    function notaEntera(valor) {
      const n = Math.round(Number(valor || 0));
      return Math.max(35, Math.min(100, n));
    }

    function convertirRango(valor, maximo) {
      const max = Number(maximo || 100);
      if (!max) return 35;
      return notaEntera((Number(valor || 0) * 100) / max);
    }

    function ponderar(nota100, peso) { return Math.round((notaEntera(nota100) * peso) / 100); }
    function color(n) { return notaEntera(n) > 50 ? "verde" : "rojo"; }

    function normalizarAsignacionesDocente(docente) {
      if (Array.isArray(docente?.asignaciones) && docente.asignaciones.length) {
        return docente.asignaciones.map(asig => ({
          curso: asig.curso,
          materias: Array.isArray(asig.materias) ? asig.materias : []
        })).filter(asig => asig.curso && asig.materias.length);
      }
      const materias = Array.isArray(docente?.materias) && docente.materias.length
        ? docente.materias
        : [docente?.materia].filter(Boolean);
      return docente?.curso && materias.length ? [{ curso: docente.curso, materias }] : [];
    }

    function guardarSesionDocenteDesdeCuenta(docente) {
      const asignaciones = normalizarAsignacionesDocente(docente);
      const cursos = [...new Set(asignaciones.map(asig => asig.curso).filter(Boolean))];
      const materias = asignaciones[0]?.materias || [];
      sessionStorage.setItem("docenteNombre", docente.nombre || sessionStorage.getItem("docenteNombre") || "");
      sessionStorage.setItem("docenteCurso", cursos[0] || "");
      sessionStorage.setItem("docenteCursos", JSON.stringify(cursos));
      sessionStorage.setItem("docenteMateria", materias[0] || "");
      sessionStorage.setItem("docenteMaterias", JSON.stringify(materias));
      sessionStorage.setItem("docenteAsignaciones", JSON.stringify(asignaciones));
      return asignaciones;
    }

    function obtenerCursos() {
      const cursos = leerJSON("cursos", []);
      const alumnos = leerJSON("alumnos");
      const base = cursos.length ? cursos : Object.keys(alumnos);
      if (sessionStorage.getItem("sesionRol") === "docente") {
        const permitidos = cursosDocenteAsignados();
        const filtrados = base.filter(curso => permitidos.includes(curso));
        return filtrados.length ? filtrados : permitidos;
      }
      return base;
    }

    function asignacionesDocente() {
      if (sessionStorage.getItem("sesionRol") !== "docente") return [];
      const usuario = sessionStorage.getItem("docenteUsuario");
      const docente = leerJSON("docentes", []).find(item => item.usuario === usuario);
      if (docente) return guardarSesionDocenteDesdeCuenta(docente);
      try {
        const asignaciones = JSON.parse(sessionStorage.getItem("docenteAsignaciones") || "[]");
        if (Array.isArray(asignaciones) && asignaciones.length) return asignaciones;
      } catch (error) {}
      const curso = sessionStorage.getItem("docenteCurso");
      let materias = [];
      try { materias = JSON.parse(sessionStorage.getItem("docenteMaterias") || "[]"); }
      catch (error) { materias = [sessionStorage.getItem("docenteMateria")].filter(Boolean); }
      return curso ? [{ curso, materias }] : [];
    }

    function cursosDocenteAsignados() {
      return [...new Set(asignacionesDocente().map(asig => asig.curso).filter(Boolean))];
    }

    function materiasDocenteAsignadas(curso = cursoActual) {
      if (sessionStorage.getItem("sesionRol") !== "docente") return [];
      return [...new Set(asignacionesDocente()
        .filter(asig => asig.curso === curso)
        .flatMap(asig => Array.isArray(asig.materias) ? asig.materias : []))];
    }

    function abrirCambioClaveDocente() {
      if (!document.getElementById("modalClaveDocente")) {
        document.body.insertAdjacentHTML("beforeend", `
          <div class="modal fade" id="modalClaveDocente" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <form onsubmit="guardarCambioClaveDocente(event)">
                  <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-key-fill"></i> Cambiar contrasena</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                  </div>
                  <div class="modal-body">
                    <label class="form-label fw-bold" for="claveActualDocente">Contrasena actual</label>
                    <input id="claveActualDocente" class="form-control mb-2" type="password" required>
                    <label class="form-label fw-bold" for="claveNuevaDocente">Contrasena nueva</label>
                    <input id="claveNuevaDocente" class="form-control mb-2" type="password" required>
                    <label class="form-label fw-bold" for="claveConfirmarDocente">Confirmar contrasena</label>
                    <input id="claveConfirmarDocente" class="form-control" type="password" required>
                    <div id="mensajeClaveDocente" class="alert alert-danger py-2 mt-3 d-none"></div>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary fw-bold" type="submit">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        `);
      }
      document.getElementById("claveActualDocente").value = "";
      document.getElementById("claveNuevaDocente").value = "";
      document.getElementById("claveConfirmarDocente").value = "";
      document.getElementById("mensajeClaveDocente").classList.add("d-none");
      new bootstrap.Modal(document.getElementById("modalClaveDocente")).show();
    }

    async function guardarCambioClaveDocente(event) {
      event.preventDefault();
      if (!window.requireInternetForFirebase("Conecte a internet para cambiar su contrasena.")) return;
      const actual = document.getElementById("claveActualDocente").value;
      const nueva = document.getElementById("claveNuevaDocente").value;
      const confirmar = document.getElementById("claveConfirmarDocente").value;
      const mensaje = document.getElementById("mensajeClaveDocente");
      const usuario = sessionStorage.getItem("docenteUsuario");
      const docentes = leerJSON("docentes", []);
      const docente = docentes.find(item => item.usuario === usuario);

      function error(texto) {
        mensaje.textContent = texto;
        mensaje.classList.remove("d-none");
      }

      if (!docente) return error("No se encontro la cuenta docente.");
      if (docente.clave !== actual) return error("La contrasena actual no es correcta.");
      if (nueva.length < 4) return error("La contrasena nueva debe tener al menos 4 caracteres.");
      if (nueva !== confirmar) return error("La confirmacion no coincide.");

      docente.clave = nueva;
      guardarJSON("docentes", docentes);
      const guardado = window.firebaseMarkPackage ? await window.firebaseMarkPackage("docentes") : true;
      if (guardado === false) return error("No se pudo guardar en Firebase. Revise la conexion.");
      bootstrap.Modal.getInstance(document.getElementById("modalClaveDocente")).hide();
      alert("Contrasena actualizada correctamente.");
    }

    function actualizarNavegacionCurso() {
      const cursoQS = cursoActual ? `?curso=${encodeURIComponent(cursoActual)}` : "";
      const navTareas = document.getElementById("navTareas");
      const navNotas = document.getElementById("navNotas");
      if (navTareas) navTareas.href = `mes.html${cursoQS}`;
      if (navNotas) navNotas.href = `notas.html${cursoQS}`;
    }

    function obtenerMaterias(trimestre = vistaActual) {
      const notas = leerJSON("notas");
      const equivalencias = {
        "1er Trimestre": "Trimestre 1",
        "2do Trimestre": "Trimestre 2",
        "3er Trimestre": "Trimestre 3"
      };
      return notas?.[cursoActual]?.[trimestre]
        || notas?.[cursoActual]?.[equivalencias[trimestre]]
        || {};
    }

    function trimestrePorMes(fechaISO) {
      const mes = Number(String(fechaISO).slice(5, 7));
      if (mes >= 1 && mes <= 4) return "1er Trimestre";
      if (mes >= 5 && mes <= 8) return "2do Trimestre";
      return "3er Trimestre";
    }

    function esAsistencia(estado) {
      return ["verde", "amarillo", "morado"].includes(estado);
    }

    function esPuntual(estado) {
      return ["verde", "morado"].includes(estado);
    }

    function fechasAsistenciaRegistradas(trimestre) {
      const asistencias = leerJSON("asistencias");
      const trimestresAsistencia = leerJSON("trimestresAsistencia");
      const fechas = new Set();

      Object.keys(asistencias).forEach(clave => {
        const [fecha, curso] = clave.split("|");
        if (curso !== cursoActual) return;
        const triClave = trimestresAsistencia[fecha] || trimestrePorMes(fecha);
        if (triClave !== trimestre) return;
        if (esAsistencia(asistencias[clave])) fechas.add(fecha);
      });

      return [...fechas].sort();
    }

    function registrosAsistenciaAlumno(alumno, trimestre) {
      const asistencias = leerJSON("asistencias");
      return fechasAsistenciaRegistradas(trimestre).map(fecha => asistencias[`${fecha}|${cursoActual}|${alumno}`] || "blanco");
    }

    function asistencia(alumno, trimestre) {
      const registros = registrosAsistenciaAlumno(alumno, trimestre);
      const total = registros.length;
      const presentes = registros.filter(esAsistencia).length;
      return total ? notaEntera((presentes * 100) / total) : 35;
    }

    function puntualidad(alumno, trimestre) {
      const registros = registrosAsistenciaAlumno(alumno, trimestre);
      const asistidos = registros.filter(esAsistencia);
      const puntuales = asistidos.filter(esPuntual).length;
      return asistidos.length ? notaEntera((puntuales * 100) / asistidos.length) : 35;
    }

    function criteriosPorDefecto() {
      return [
        { id:"participacion", nombre:"Participacion", max:10 },
        { id:"honestidad", nombre:"Honestidad", max:5 }
      ];
    }

    function normalizarCriterios(valor) {
      if (!Array.isArray(valor) || !valor.length) return criteriosPorDefecto();
      return valor.map((item, index) => typeof item === "string"
        ? { id:`criterio${index + 1}`, nombre:item, max:100 }
        : {
            id:item.id || `criterio${index + 1}`,
            nombre:item.nombre || `SER ${index + 1}`,
            max:Math.max(1, Number(item.max || 100))
          });
    }

    function obtenerCriterios(trimestre = vistaActual) {
      const todos = leerJSON("serCriterios");
      return normalizarCriterios(todos?.[cursoActual]?.[trimestre]);
    }

    function guardarCriterios(lista) {
      const todos = leerJSON("serCriterios");
      if (!todos[cursoActual]) todos[cursoActual] = {};
      todos[cursoActual][vistaActual] = lista;
      guardarJSON("serCriterios", todos);
    }

    function valorSer(alumno, criterio, trimestre = vistaActual) {
      const ser = leerJSON("ser");
      const datos = ser?.[cursoActual]?.[trimestre]?.[alumno] || {};
      return Number(datos[criterio.id] ?? 0);
    }

    function guardarSer(alumno, criterioId, valor) {
      const ser = leerJSON("ser");
      if (!ser[cursoActual]) ser[cursoActual] = {};
      if (!ser[cursoActual][vistaActual]) ser[cursoActual][vistaActual] = {};
      if (!ser[cursoActual][vistaActual][alumno]) ser[cursoActual][vistaActual][alumno] = {};
      ser[cursoActual][vistaActual][alumno][criterioId] = Math.max(0, Number(valor || 0));
      guardarJSON("ser", ser);
    }

    function valorAuto(alumno, trimestre = vistaActual) {
      const auto = leerJSON("autoevaluacion");
      return Number(auto?.[cursoActual]?.[trimestre]?.[alumno] ?? 0);
    }

    function configAuto(trimestre = vistaActual) {
      const todos = leerJSON("autoevaluacionConfig");
      const cfg = todos?.[cursoActual]?.[trimestre] || {};
      return {
        titulo: cfg.titulo || "Autoevaluacion",
        max: Math.max(1, Number(cfg.max || 5))
      };
    }

    function guardarConfigAuto(cfg) {
      const todos = leerJSON("autoevaluacionConfig");
      if (!todos[cursoActual]) todos[cursoActual] = {};
      todos[cursoActual][vistaActual] = cfg;
      guardarJSON("autoevaluacionConfig", todos);
    }

    function guardarAuto(alumno, valor) {
      const auto = leerJSON("autoevaluacion");
      if (!auto[cursoActual]) auto[cursoActual] = {};
      if (!auto[cursoActual][vistaActual]) auto[cursoActual][vistaActual] = {};
      auto[cursoActual][vistaActual][alumno] = Math.max(0, Number(valor || 0));
      guardarJSON("autoevaluacion", auto);
    }

    function renderCursos() {
      const cursos = obtenerCursos();
      const colores = leerJSON("cursoColores");

      if (!cursos.length) {
        cursoSelector.innerHTML = "";
        contenido.innerHTML = '<div class="alert alert-info text-center">No existen cursos registrados.</div>';
        return;
      }

      if (!cursoActual || !cursos.includes(cursoActual)) {
        const cursoParametro = new URLSearchParams(window.location.search).get("curso");
        const cursoGuardado = cursoParametro || localStorage.getItem("cursoSeleccionado");
        cursoActual = cursos.includes(cursoGuardado) ? cursoGuardado : cursos[0];
        localStorage.setItem("cursoSeleccionado", cursoActual);
      }
      actualizarNavegacionCurso();
      cursoSelector.innerHTML = cursos.map(curso => {
        const activo = curso === cursoActual;
        const color = colores[curso] || "#0d6efd";
        return `<button class="course-btn ${activo ? "active" : ""}" style="${activo ? `background:${color}; border-color:${color};` : `border-color:${color};`}" onclick="cambiarCurso('${escaparAtributo(curso)}')">${escapar(curso)}</button>`;
      }).join("");
    }

    function cambiarCurso(curso) {
      cursoActual = curso;
      localStorage.setItem("cursoSeleccionado", curso);
      actualizarNavegacionCurso();
      materiaActual = "";
      renderTodo();
    }

    function renderTrimestres() {
      const radio = document.querySelector(`input[name="trimestre"][value="${vistaActual}"]`);
      if (radio) radio.checked = true;
    }

    function actividadesMateria(trimestre, materia) {
      const materias = obtenerMaterias(trimestre);
      const actividades = materias[materia] || {};
      const tareas = [];
      const examenes = [];
      Object.keys(actividades).forEach(nombre => {
        const actividad = { nombre, ...actividades[nombre] };
        if (actividad.tipo === "Tarea") tareas.push(actividad);
        else examenes.push(actividad);
      });
      return { tareas, examenes };
    }

    function materiasDisponiblesVista() {
      const materiasDocente = materiasDocenteAsignadas(cursoActual);
      const filtrar = materias => materiasDocente.length ? materias.filter(materia => materiasDocente.includes(materia)) : materias;
      if (vistaActual !== "Promedio Final") return filtrar(Object.keys(obtenerMaterias(vistaActual)));
      return filtrar([...new Set(TRIS.flatMap(tri => Object.keys(obtenerMaterias(tri))))]);
    }

    function renderTabs() {
      const materias = materiasDisponiblesVista();
      if (!materias.length) {
        tabsMaterias.innerHTML = "";
        materiaActual = "";
        return;
      }
      if (!materiaActual || !materias.includes(materiaActual)) materiaActual = materias[0];
      tabsMaterias.innerHTML = materias.map(materia => `
        <li class="nav-item">
          <button class="nav-link ${materia === materiaActual ? "active" : ""}" onclick="cambiarMateria('${escaparAtributo(materia)}')">${escapar(materia)}</button>
        </li>
      `).join("");
    }

    function cambiarMateria(materia) {
      materiaActual = materia;
      renderTabs();
      renderNotas();
    }

    function promedioActividades(lista, alumno) {
      if (!lista.length) return 35;
      const suma = lista.reduce((total, act) => {
        const dato = act.alumnos?.[alumno];
        return total + notaEntera(dato ? dato.nota100 : 35);
      }, 0);
      return notaEntera(suma / lista.length);
    }

    function responsabilidad(tareas, alumno) {
      if (!tareas.length) return 35;
      const buenas = tareas.filter(tarea => {
        const dato = tarea.alumnos?.[alumno];
        return dato && notaEntera(dato.nota100) > 35;
      }).length;
      return notaEntera((buenas * 100) / tareas.length);
    }

    function calcularAlumno(alumno, trimestre, materia) {
      const { tareas, examenes } = actividadesMateria(trimestre, materia);
      const hacer100 = promedioActividades(tareas, alumno);
      const saber100 = promedioActividades(examenes, alumno);
      const asistencia100 = asistencia(alumno, trimestre);
      const puntualidad100 = puntualidad(alumno, trimestre);
      const responsabilidad100 = responsabilidad(tareas, alumno);
      const criterios = obtenerCriterios(trimestre);
      const notasSer = criterios.map(criterio => convertirRango(valorSer(alumno, criterio, trimestre), criterio.max));
      const ser100 = notaEntera((asistencia100 + puntualidad100 + responsabilidad100 + notasSer.reduce((s, n) => s + n, 0)) / (3 + criterios.length));
      const autoCfg = configAuto(trimestre);
      const auto100 = convertirRango(valorAuto(alumno, trimestre), autoCfg.max);
      const hacer40 = ponderar(hacer100, 40);
      const saber45 = ponderar(saber100, 45);
      const ser10 = ponderar(ser100, 10);
      const auto5 = ponderar(auto100, 5);
      const final = hacer40 + saber45 + ser10 + auto5;
      return { tareas, examenes, criterios, hacer100, saber100, asistencia100, puntualidad100, responsabilidad100, notasSer, ser100, auto100, hacer40, saber45, ser10, auto5, final };
    }

    function actualizarCriterio(index, campo, valor) {
      const lista = obtenerCriterios();
      if (!lista[index]) return;
      lista[index][campo] = campo === "max" ? Math.max(1, Number(valor || 1)) : (valor.trim() || `SER ${index + 1}`);
      guardarCriterios(lista);
      renderTodo();

      if (vistaActual === "Promedio Final") return alert("Seleccione un trimestre para agregar columnas SER.");
      const lista = obtenerCriterios();
      lista.push({ id:`criterio_${Date.now()}`, nombre:"Nueva nota SER", max:100 });
      guardarCriterios(lista);
      renderTodo();
    }

    function eliminarCriterioSer(index) {
      const lista = obtenerCriterios();
      lista.splice(index, 1);
      guardarCriterios(lista);
      renderTodo();
    }

    function abrirConfigSer(criterioId) {
      const criterios = obtenerCriterios();
      const index = criterios.findIndex(c => c.id === criterioId);
      if (index < 0) return;
      configContexto = { tipo: "ser", index };
      document.getElementById("tituloConfigNota").textContent = "Configurar SER";
      document.getElementById("configTitulo").value = criterios[index].nombre;
      document.getElementById("configMax").value = criterios[index].max;
      document.getElementById("btnEliminarConfig").classList.remove("hidden");
      modalConfigNota.show();
    }

    function abrirConfigAuto() {
      const cfg = configAuto();
      configContexto = { tipo: "auto" };
      document.getElementById("tituloConfigNota").textContent = "Configurar autoevaluacion";
      document.getElementById("configTitulo").value = cfg.titulo;
      document.getElementById("configMax").value = cfg.max;
      document.getElementById("btnEliminarConfig").classList.add("hidden");
      modalConfigNota.show();
    }

    function guardarConfigNota() {
      if (!configContexto) return;
      const titulo = document.getElementById("configTitulo").value.trim() || "Nota";
      const max = Math.max(1, Number(document.getElementById("configMax").value || 1));

      if (configContexto.tipo === "ser") {
        const criterios = obtenerCriterios();
        if (!criterios[configContexto.index]) return;
        criterios[configContexto.index].nombre = titulo;
        criterios[configContexto.index].max = max;
        guardarCriterios(criterios);
      } else {
        guardarConfigAuto({ titulo, max });
      }

      modalConfigNota.hide();
      renderTodo();
    }

    function eliminarConfigNota() {
      if (!configContexto || configContexto.tipo !== "ser") return;
      const criterios = obtenerCriterios();
      const criterio = criterios[configContexto.index];
      if (!criterio) return;
      if (!confirm(`Esta seguro que desea eliminar ${criterio.nombre}?`)) return;
      criterios.splice(configContexto.index, 1);
      guardarCriterios(criterios);
      modalConfigNota.hide();
      renderTodo();
    }

    function abrirNota(tipo, alumno, criterioId = "") {
      if (vistaActual === "Promedio Final") return;
      let max = 5;
      let titulo = "Autoevaluacion";
      let valor = valorAuto(alumno);
      if (tipo === "ser") {
        const criterio = obtenerCriterios().find(c => c.id === criterioId);
        if (!criterio) return;
        max = Number(criterio.max);
        titulo = criterio.nombre;
        valor = valorSer(alumno, criterio);
        modalContexto = { tipo, alumno, criterioId };
      } else {
        const cfg = configAuto();
        max = cfg.max;
        titulo = cfg.titulo;
        modalContexto = { tipo, alumno };
      }

      document.getElementById("tituloModalNota").textContent = titulo;
      document.getElementById("detalleModalNota").textContent = `${alumno} - maximo ${max}`;
      let html = "";
      for (let i = 0; i <= max; i++) html += `<button class="nota-btn ${i === valor ? "sel" : ""}" onclick="seleccionarNota(${i})">${i}</button>`;
      document.getElementById("botonesNota").innerHTML = html;
      modalNota.show();

      if (!modalContexto) return;
      if (modalContexto.tipo === "ser") guardarSer(modalContexto.alumno, modalContexto.criterioId, valor);

      renderNotas();

    function cursoImpresion(curso) {
      const texto = String(curso || "").toUpperCase();
      const mapa = { 1: "PRIMERO", 2: "SEGUNDO", 3: "TERCERO", 4: "CUARTO", 5: "QUINTO", 6: "SEXTO" };
      const match = texto.match(/([1-6])/);
      if (/PRE\s*INICIAL|INICIAL/.test(texto)) return "PRE INICIAL - INICIAL";
      return match ? mapa[match[1]] : texto;
    }

    function trimestreImpresion(trimestre) {
      if (/2/.test(trimestre)) return "2DO TRIMESTRE";
      if (/3/.test(trimestre)) return "3ER TRIMESTRE";
      return "1ER TRIMESTRE";
    }

    function campoImpresion(materia) {
      const texto = String(materia || "").toLowerCase();
      if (/matem/.test(texto)) return "CIENCIA TECNOLOGIA Y PRODUCCION";
      if (/lenguaje|sociales|religion|música|musica|artes/.test(texto)) return "COMUNIDAD Y SOCIEDAD";
      if (/naturales/.test(texto)) return "VIDA TIERRA TERRITORIO";
      if (/fisica|física/.test(texto)) return "VIDA TIERRA TERRITORIO";
      return "COMUNIDAD Y SOCIEDAD";
    }

    function docenteImpresion() {
      const usuario = sessionStorage.getItem("docenteUsuario") || "";
      const docente = leerJSON("docentes", []).find(item => item.usuario === usuario);
      return (docente?.nombre || sessionStorage.getItem("docenteNombre") || "DOCENTE").toUpperCase();
    }

    function situacion(nota) {
      return nota >= 51 ? "APROBADO" : "REPROBADO";

    function thVertical(texto, clase = "") {
      const promedioClass = String(texto || "").toLowerCase() === "promedio" ? "print-promedio" : "";
      return `<th class="vertical-print thin ${clase} ${promedioClass} ${claseTituloLargo(texto)}">${escapar(texto)}</th>`;
    }

    function claseTituloLargo(texto) {
      const largo = String(texto || "").trim().length;
      if (largo >= 28) return "titulo-muy-largo";
      if (largo >= 18) return "titulo-largo";
      return "";
    }

    function thVistaVertical(texto, contenido = null) {
      const simple = String(texto || "").toLowerCase();
      const pesoClass = ["promedio", "puntaje"].includes(simple) ? "promedio-puntaje" : "";
      return `<th class="vertical ${claseTituloLargo(texto)} ${pesoClass}">${contenido ?? escapar(texto)}</th>`;

    function columnasVista(totalCols) {
      const columnasNotas = Math.max(1, totalCols - 2);
      const alumnoPct = totalCols <= 8 ? 34 : totalCols <= 17 ? 25 : totalCols <= 27 ? 20 : 17;
      const nroPct = totalCols <= 17 ? 5 : 3.8;
      const notaPct = (100 - alumnoPct - nroPct) / columnasNotas;
      const minDesktop = Math.max(760, Math.round(42 + 170 + columnasNotas * 46));
      const minMobile = Math.max(390, Math.round(38 + 116 + columnasNotas * 34));
      return {
        style: `--table-min-width:${minDesktop}px;--table-min-width-mobile:${minMobile}px`,
        cols: `
          <colgroup>
            <col style="width:${nroPct}%">
            <col style="width:${alumnoPct}%">
            ${Array.from({ length: columnasNotas }, () => `<col style="width:${notaPct}%">`).join("")}
          </colgroup>
        `
      };
    }

    function estiloImpresion(totalCols, totalFilas) {
      let vars = {
        main: 7.4,
        row: 14,
        nameFont: 7,
        header: 92,
        logo: 54
      };

      if (totalCols <= 22) {
        vars = { main: 8.8, row: 17, nameFont: 8.2, header: 104, logo: 64 };
      } else if (totalCols <= 28) {
        vars = { main: 7.8, row: 15, nameFont: 7.4, header: 96, logo: 58 };
      } else if (totalCols >= 36) {
        vars = { main: 6.2, row: 11, nameFont: 5.9, header: 82, logo: 48 };
      }

      if (totalFilas > 30) vars.row = Math.max(10, vars.row - 2);
      if (totalFilas > 36) vars.main = Math.max(5.8, vars.main - .5);

      return [
        `--print-main-font:${vars.main}px`,
        `--print-row-height:${vars.row}px`,
        `--print-name-font:${vars.nameFont}px`,
        `--print-header-height:${vars.header}px`,
        `--print-logo-size:${vars.logo}px`
      ].join(";");
    }

      const columnasNotas = Math.max(1, totalCols - 2);

      const notaPct = (100 - nombrePct - nroPct) / columnasNotas;
      return `
        <colgroup>
          <col style="width:${nroPct}%">
          <col style="width:${nombrePct}%">
          ${Array.from({ length: columnasNotas }, () => `<col style="width:${notaPct}%">`).join("")}
        </colgroup>

              </div>
            </div>
            <div class="print-sidebox">
              <div class="print-parallel"><strong>ANO DE ESCOLARIDAD</strong><span style="font-size:15px;">${escapar(cursoImpresion(cursoActual))}</span></div>
              <div class="print-parallel"><strong>PARALELO</strong><span>A</span></div>
            </div>
          </div>
          <div class="print-layout">
            <table class="eval-table">
              ${colgroup}
              <thead>${thead}</thead>
              <tbody>${tbody}</tbody>
            </table>
          </div>
          <div class="print-signatures">
            <div class="signature-line">${escapar(docenteNombre)}<small>MAESTRO DEL AREA DE ${escapar(String(materiaActual).toUpperCase())}</small></div>
            <div class="signature-line">${escapar(directorNombre)}<small>DIRECTOR UNIDAD EDUCATIVA ECOLOGICA NUEVA BOLIVIA</small></div>
          </div>
        </section>
      `;
      window.print();
    }

    function renderTodo() {
      renderCursos();
      renderTrimestres();
      renderCriterios();
      renderTabs();
      renderNotas();
    }

    document.querySelectorAll('input[name="trimestre"]').forEach(input => {
      input.addEventListener("change", () => {
        vistaActual = input.value;
        if (vistaActual !== "Promedio Final") localStorage.setItem("trimestreActual", vistaActual);
        materiaActual = "";
        renderTodo();
      });
    });

    window.firebaseAfterDataUpdated = function () {
      renderNavbar();
      renderTodo();
    };



    renderNavbar();
    renderTodo();
  </script>
</body>
</html>
