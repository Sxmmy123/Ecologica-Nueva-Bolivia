<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background:#eef5f9; color:#213547; font-family:"Segoe UI", Arial, sans-serif; }
    main.container-fluid { max-width:1280px; margin:0 auto; }
    .app-navbar { background:#12355b; border-radius:0; box-shadow:0 6px 16px rgba(0,0,0,.14); display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 calc(50% - 50vw) 18px; min-height:58px; padding:10px 24px; width:100vw; }
    .app-navbar a, .app-navbar button { align-items:center; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); border-radius:8px; color:#fff; display:inline-flex; gap:7px; font-weight:800; min-height:38px; padding:8px 14px; text-decoration:none; }
    .director-navbar { align-items:center; justify-content:flex-start; }
    .director-brand { align-items:center; color:#fff; display:inline-flex; font-weight:900; gap:8px; letter-spacing:.3px; }
    .director-menu-btn { background:#fff!important; border-color:#fff!important; color:#12355b!important; justify-content:center; margin-left:auto; min-width:46px; }
    .director-sidebar { background:#12355b; color:#fff; max-width:96px; }
    .director-sidebar .offcanvas-header { border-bottom:1px solid rgba(255,255,255,.18); justify-content:center; padding:12px 8px; }
    .director-sidebar .btn-close { filter:invert(1) grayscale(1); opacity:.9; }
    .director-icon-nav { display:grid; gap:12px; justify-items:center; }
    .director-icon-nav a, .director-icon-nav button { align-items:center; background:rgba(255,255,255,.12)!important; border:1px solid rgba(255,255,255,.25)!important; border-radius:14px; color:#fff!important; display:inline-flex; font-size:23px; height:54px; justify-content:center; padding:0!important; width:54px; }
    .director-icon-nav .active { background:#fff!important; color:#12355b!important; }
    .director-icon-nav .director-logout { background:#dc3545!important; border-color:#ffb3bd!important; margin-top:6px; }
    .panel { background:#fff; border:1px solid #dbe7ef; border-radius:10px; box-shadow:0 6px 18px rgba(30,60,90,.08); padding:16px; }
    .report-title { border-left:8px solid #12355b; }
    .nav-tabs .nav-link { color:#12355b; font-weight:900; }
    .nav-tabs .nav-link.active { border-top:4px solid #12355b; color:#12355b; }
    .metric-card { border:1px solid #dbe7ef; border-radius:8px; padding:14px; }
    .metric-value { color:#12355b; font-size:1.8rem; font-weight:900; line-height:1; }
    .table thead th { background:#12355b; color:#fff; }
    .risk-high { color:#bb2d3b; font-weight:900; }
    .risk-ok { color:#198754; font-weight:900; }
    .course-report { border:1px solid #dbe7ef; border-left:8px solid #12355b; border-radius:10px; margin-bottom:16px; overflow:hidden; }
    .course-head { align-items:center; background:#f8fafc; border-bottom:1px solid #dbe7ef; display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; padding:12px 14px; }
    .course-name { color:#12355b; font-weight:900; margin:0; }
    .course-pill { background:#e8f2ff; border:1px solid #bfd4ea; border-radius:999px; color:#12355b; font-size:12px; font-weight:900; padding:5px 10px; }
    .course-body { padding:14px; }
    .status-stack { background:#eef2f6; border:1px solid #dbe7ef; border-radius:999px; display:flex; height:18px; min-width:180px; overflow:hidden; }
    .status-seg { min-width:0; }
    .seg-asistencia { background:#37b86b; }
    .seg-atraso { background:#ffc107; }
    .seg-permiso { background:#a56eff; }
    .seg-falta { background:#dc3545; }
    .legend { display:flex; flex-wrap:wrap; gap:8px; }
    .legend-item { align-items:center; color:#506070; display:inline-flex; font-size:12px; font-weight:800; gap:5px; }
    .legend-dot { border-radius:50%; display:inline-block; height:10px; width:10px; }
    .chart-card { background:#f8fafc; border:1px solid #dbe7ef; border-radius:10px; padding:14px; }
    .chart-row { display:grid; gap:8px; grid-template-columns:minmax(110px, 170px) 1fr 52px; margin-bottom:10px; align-items:center; }
    .chart-label { color:#12355b; font-size:13px; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .chart-track { background:#e7edf4; border-radius:999px; height:18px; overflow:hidden; }
    .chart-fill { background:linear-gradient(90deg, #37b86b, #0f766e); border-radius:999px; height:100%; min-width:2px; }
    .chart-value { color:#12355b; font-weight:900; text-align:right; }
  </style>
  <script src="firebase-config.js"></script>
  <script src="firebase-sync.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12355b">
  <link rel="icon" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <script defer src="pwa.js"></script>
</head>
<body>
<script>
  if (!["director", "admin"].includes(sessionStorage.getItem("sesionRol"))) {
    window.location.href = "index.html";
  }
</script>

<main class="container-fluid py-4">
  <nav class="app-navbar director-navbar" id="appNavbar"></nav>

  <section class="panel report-title mb-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h1 class="h3 fw-black fw-bold mb-1">Reportes</h1>
        <div class="text-muted fw-bold">Vista general para direccion</div>
      </div>
      <button class="btn btn-outline-primary fw-bold" type="button" onclick="renderReportes()">
        <i class="bi bi-arrow-clockwise"></i> Actualizar
      </button>
    </div>
  </section>

  <section class="panel">
    <ul class="nav nav-tabs" id="reportTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="riesgo-tab" data-bs-toggle="tab" data-bs-target="#riesgo-pane" type="button" role="tab">
          <i class="bi bi-exclamation-triangle-fill"></i> Riesgo
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="ranking-tab" data-bs-toggle="tab" data-bs-target="#ranking-pane" type="button" role="tab">
          <i class="bi bi-trophy-fill"></i> Ranking
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="resumen-tab" data-bs-toggle="tab" data-bs-target="#resumen-pane" type="button" role="tab">
          <i class="bi bi-clipboard-data-fill"></i> Resumen Asistencia
        </button>
      </li>
    </ul>

    <div class="tab-content pt-3">
      <div class="tab-pane fade show active" id="riesgo-pane" role="tabpanel" tabindex="0">
        <div id="reporteRiesgo"></div>
      </div>
      <div class="tab-pane fade" id="ranking-pane" role="tabpanel" tabindex="0">
        <div id="reporteRanking"></div>
      </div>
      <div class="tab-pane fade" id="resumen-pane" role="tabpanel" tabindex="0">
        <div id="reporteResumen"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function leerJSON(clave, inicial = {}) {
    try {
      const valor = localStorage.getItem(clave);
      return valor ? JSON.parse(valor) : inicial;
    } catch (error) {
      return inicial;
    }
  }

  function escapar(texto) {
    return String(texto ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
  }

  function cerrarSesion() {
    sessionStorage.clear();
    window.location.href = "index.html";
  }

  function directorNavbarHTML() {
    const item = (clave, href, icono, titulo) => `<a class="${clave === "reportes" ? "active" : ""}" href="${href}" title="${titulo}" aria-label="${titulo}"><i class="bi ${icono}"></i></a>`;
    return `
      <span class="director-brand"><i class="bi bi-eye-fill"></i> DIRECTOR</span>
      <button class="director-menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#directorSidebar" aria-controls="directorSidebar" aria-label="Abrir menu">
        <i class="bi bi-list"></i>
      </button>
      <div class="offcanvas offcanvas-end director-sidebar" tabindex="-1" id="directorSidebar" aria-labelledby="directorSidebarLabel">
        <div class="offcanvas-header">
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
          <nav class="director-icon-nav" id="directorSidebarLabel">
            ${item("asistencias", "dia.html", "bi-clipboard2-check-fill", "Asistencias")}
            ${item("horario", "horario.html", "bi-calendar3-week-fill", "Horarios")}
            ${item("notas", "notas.html", "bi-journal-check", "Notas")}
            ${item("reportes", "reportes.html", "bi-bar-chart-line-fill", "Reportes")}
            <button class="director-logout" type="button" onclick="cerrarSesion()" title="Salir" aria-label="Salir"><i class="bi bi-power"></i></button>
          </nav>
        </div>
      </div>
    `;
  }

  function estadoNormal(estado) {
    return String(estado || "blanco").toLowerCase();
  }

  function cuentaComoAsistencia(estado) {
    return ["verde", "amarillo", "morado", "permiso", "licencia", "p", "a", "l"].includes(estadoNormal(estado));
  }

  function etiquetaEstado(estado) {
    const mapa = { verde:"Asistencia", amarillo:"Atraso", morado:"Permiso", blanco:"Falta" };
    return mapa[estadoNormal(estado)] || estado || "Falta";
  }

  function parseRegistro(clave, estado) {
    const partes = String(clave).split("|");
    if (partes.length < 3) return null;
    return { fecha: partes[0], curso: partes[1], alumno: partes.slice(2).join("|"), estado: estado || "blanco" };
  }

  function fechasValidasPorCurso(alumnosPorCurso, asistencias) {
    const agrupado = {};
    Object.entries(asistencias).forEach(([clave, estado]) => {
      const reg = parseRegistro(clave, estado);
      if (!reg || !alumnosPorCurso[reg.curso]) return;
      const id = `${reg.curso}|${reg.fecha}`;
      if (!agrupado[id]) agrupado[id] = [];
      agrupado[id].push(reg);
    });
    const validas = {};
    Object.entries(agrupado).forEach(([id, registros]) => {
      const [curso, fecha] = id.split("|");
      if (!registros.some(reg => cuentaComoAsistencia(reg.estado))) return;
      if (!validas[curso]) validas[curso] = new Set();
      validas[curso].add(fecha);
    });
    return validas;
  }

  function indicadoresAlumnos() {
    const alumnosPorCurso = leerJSON("alumnos", {});
    const asistencias = leerJSON("asistencias", {});
    const validas = fechasValidasPorCurso(alumnosPorCurso, asistencias);
    const filas = [];

    Object.entries(alumnosPorCurso).forEach(([curso, alumnos]) => {
      const fechas = [...(validas[curso] || [])].sort();
      (Array.isArray(alumnos) ? alumnos : []).forEach(alumno => {
        let presentes = 0;
        let asistenciasOk = 0;
        let atrasos = 0;
        let permisos = 0;
        let faltas = 0;
        fechas.forEach(fecha => {
          const estado = asistencias[`${fecha}|${curso}|${alumno}`] || "blanco";
          if (cuentaComoAsistencia(estado)) presentes++;
          else faltas++;
          if (["verde", "p"].includes(estadoNormal(estado))) asistenciasOk++;
          if (estadoNormal(estado) === "amarillo") atrasos++;
          if (estadoNormal(estado) === "morado") permisos++;
        });
        const total = fechas.length;
        const porcentaje = total ? Math.round((presentes / total) * 100) : 0;
        filas.push({ curso, alumno, total, presentes, asistenciasOk, atrasos, permisos, faltas, porcentaje });
      });
    });
    return filas;
  }

  function agruparPorCurso(indicadores) {
    return indicadores.reduce((acc, item) => {
      if (!acc[item.curso]) acc[item.curso] = [];
      acc[item.curso].push(item);
      return acc;
    }, {});
  }

  function resumenPorCurso(indicadores) {
    return indicadores.reduce((acc, item) => {
      if (!acc[item.curso]) acc[item.curso] = { alumnos:0, total:0, presentes:0, asistencia:0, atrasos:0, permisos:0, faltas:0 };
      acc[item.curso].alumnos++;
      acc[item.curso].total += item.total;
      acc[item.curso].presentes += item.presentes;
      acc[item.curso].asistencia += item.asistenciasOk;
      acc[item.curso].atrasos += item.atrasos;
      acc[item.curso].permisos += item.permisos;
      acc[item.curso].faltas += item.faltas;
      return acc;
    }, {});
  }

  function tabla(headers, filas, vacio) {
    if (!filas.length) return `<div class="alert alert-info mb-0">${vacio}</div>`;
    return `
      <div class="table-responsive">
        <table class="table table-bordered table-sm align-middle">
          <thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
          <tbody>${filas.join("")}</tbody>
        </table>
      </div>
    `;
  }

  function seccionesPorCurso(indicadores, crearFilas, vacioCurso) {
    const grupos = agruparPorCurso(indicadores);
    const cursos = Object.keys(grupos);
    if (!cursos.length) return '<div class="alert alert-info mb-0">No hay cursos con datos para mostrar.</div>';
    return cursos.map(curso => {
      const filas = crearFilas(grupos[curso], curso);
      return `
        <section class="course-report">
          <div class="course-head">
            <h3 class="h5 course-name">${escapar(curso)}</h3>
            <span class="course-pill">${grupos[curso].length} alumnos</span>
          </div>
          <div class="course-body">
            ${filas.rows.length ? tabla(filas.headers, filas.rows, vacioCurso) : `<div class="alert alert-success mb-0">${vacioCurso}</div>`}
          </div>
        </section>
      `;
    }).join("");
  }

  function renderRiesgo(indicadores) {
    document.getElementById("reporteRiesgo").innerHTML = seccionesPorCurso(indicadores, alumnos => {
      const riesgo = alumnos
        .filter(item => item.total > 0 && item.porcentaje < 75)
        .sort((a, b) => a.porcentaje - b.porcentaje || b.faltas - a.faltas);
      return {
        headers: ["Alumno", "Asistencia", "Faltas", "Atrasos", "Permisos"],
        rows: riesgo.map(item => `
          <tr>
            <td>${escapar(item.alumno)}</td>
            <td class="risk-high">${item.porcentaje}%</td>
            <td>${item.faltas}</td>
            <td>${item.atrasos}</td>
            <td>${item.permisos}</td>
          </tr>
        `)
      };
    }, "Sin alumnos en riesgo en este curso.");
  }

  function renderRanking(indicadores) {
    document.getElementById("reporteRanking").innerHTML = seccionesPorCurso(indicadores, alumnos => {
      const ranking = alumnos
        .filter(item => item.total > 0)
        .sort((a, b) => b.porcentaje - a.porcentaje || a.faltas - b.faltas);
      return {
        headers: ["#", "Alumno", "Asistencia", "Presentes", "Atrasos"],
        rows: ranking.map((item, index) => `
          <tr>
            <td class="fw-bold">${index + 1}</td>
            <td>${escapar(item.alumno)}</td>
            <td class="${item.porcentaje >= 75 ? "risk-ok" : "risk-high"}">${item.porcentaje}%</td>
            <td>${item.presentes}/${item.total}</td>
            <td>${item.atrasos}</td>
          </tr>
        `)
      };
    }, "Todavia no hay asistencias registradas para armar el ranking de este curso.");
  }

  function renderResumen(indicadores) {
    const resumen = resumenPorCurso(indicadores);
    const cursos = Object.entries(resumen);
    if (!cursos.length) {
      document.getElementById("reporteResumen").innerHTML = '<div class="alert alert-info mb-0">No hay datos de asistencia para resumir.</div>';
      return;
    }

    const graficoGeneral = `
      <section class="chart-card mb-3">
        <h3 class="h5 fw-bold mb-3"><i class="bi bi-graph-up-arrow"></i> Estadistica general por curso</h3>
        ${cursos.map(([curso, item]) => {
          const porcentaje = item.total ? Math.round((item.presentes / item.total) * 100) : 0;
          return `
            <div class="chart-row">
              <div class="chart-label" title="${escapar(curso)}">${escapar(curso)}</div>
              <div class="chart-track"><div class="chart-fill" style="width:${porcentaje}%"></div></div>
              <div class="chart-value">${porcentaje}%</div>
            </div>
          `;
        }).join("")}
      </section>
    `;

    const leyenda = `
      <div class="legend mb-3">
        <span class="legend-item"><span class="legend-dot seg-asistencia"></span> Asistencia</span>
        <span class="legend-item"><span class="legend-dot seg-atraso"></span> Atraso</span>
        <span class="legend-item"><span class="legend-dot seg-permiso"></span> Permiso</span>
        <span class="legend-item"><span class="legend-dot seg-falta"></span> Falta</span>
      </div>
    `;

    const resumenCursos = cursos.map(([curso, item]) => {
      const porcentaje = item.total ? Math.round((item.presentes / item.total) * 100) : 0;
      const pAsistencia = item.total ? (item.asistencia / item.total) * 100 : 0;
      const pAtraso = item.total ? (item.atrasos / item.total) * 100 : 0;
      const pPermiso = item.total ? (item.permisos / item.total) * 100 : 0;
      const pFalta = item.total ? (item.faltas / item.total) * 100 : 0;
      return `
        <section class="course-report">
          <div class="course-head">
            <h3 class="h5 course-name">${escapar(curso)}</h3>
            <span class="course-pill">${porcentaje}% asistencia total</span>
          </div>
          <div class="course-body">
            <div class="status-stack mb-3" title="Asistencia ${Math.round(pAsistencia)}%, atraso ${Math.round(pAtraso)}%, permiso ${Math.round(pPermiso)}%, falta ${Math.round(pFalta)}%">
              <div class="status-seg seg-asistencia" style="width:${pAsistencia}%"></div>
              <div class="status-seg seg-atraso" style="width:${pAtraso}%"></div>
              <div class="status-seg seg-permiso" style="width:${pPermiso}%"></div>
              <div class="status-seg seg-falta" style="width:${pFalta}%"></div>
            </div>
            ${tabla(
              ["Alumnos", "Asistencia", "Presentes", "Atrasos", "Permisos", "Faltas"],
              [`
                <tr>
                  <td>${item.alumnos}</td>
                  <td class="${porcentaje >= 75 ? "risk-ok" : "risk-high"}">${porcentaje}%</td>
                  <td>${item.presentes}</td>
                  <td>${item.atrasos}</td>
                  <td>${item.permisos}</td>
                  <td>${item.faltas}</td>
                </tr>
              `],
              "Sin datos."
            )}
          </div>
        </section>
      `;
    }).join("");

    document.getElementById("reporteResumen").innerHTML = graficoGeneral + leyenda + resumenCursos;
  }

  function renderReportes() {
    const indicadores = indicadoresAlumnos();
    renderRiesgo(indicadores);
    renderRanking(indicadores);
    renderResumen(indicadores);
  }

  document.getElementById("appNavbar").innerHTML = directorNavbarHTML();
  renderReportes();
</script>
</body>
</html>
